<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Emily's Studio</title>
<!-- Emily's house as a full page (owner, 2026-10-21: "can we turn Emily's
     interface to a full sized page like almost every other agent has"). It
     was a small panel of 130px thumbnails, and Request revision lived only on
     the Shop board, so the owner looking at a bad design in her house had no
     way to send it back. Every card comes from /api/emily/builds; Try again
     is emily-finish.py --retry, Request revision is the Shop board's own
     store-board.py revise, Delete is DELETE /api/emily/builds/:slug. Nothing is
     decided here and nothing here publishes. Opened from her house (?embed=1). -->
<style>
  :root{
    --bg:#0b1020; --panel:#10172a; --card:#131b31; --line:rgba(148,163,184,.16);
    --ink:#e6e9f2; --mute:#94a0b8; --dim:#5f6b85;
    --green:#22c55e; --green2:#4ade80; --amber:#f59e0b; --red:#f43f5e; --blue:#38bdf8; --pink:#f472b6;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding:16px}
  body.embed{padding:10px;background:rgba(5,8,16,.94)}
  a{color:inherit}
  .frame{max-width:1280px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 20px 70px rgba(0,0,0,.5);overflow:hidden}
  .head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;padding:20px 22px 14px}
  .head h1{margin:0;font-size:26px;letter-spacing:-.01em}
  .head .sub{color:var(--mute);margin-top:2px}
  .sp{flex:1}
  .btn{font:600 13px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);
    border-radius:8px;padding:9px 14px;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-block}
  .btn:hover{border-color:var(--mute)}
  .btn.go{color:var(--green2);border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.08)}
  .btn.warn{color:#fb7185;border-color:rgba(244,63,94,.5)}
  .btn.tt{color:#fff;border-color:rgba(244,114,182,.6);background:rgba(244,114,182,.14)}
  .btn:disabled{opacity:.5;cursor:default}
  .status{margin:0 22px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
  .status .line{font-weight:600;margin-top:3px}
  .tabs{display:flex;gap:6px;padding:0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{font:600 14px var(--sans);color:var(--mute);background:none;border:0;border-bottom:2px solid transparent;
    padding:12px 12px;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--ink);border-bottom-color:var(--pink)}
  .tab .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;font-size:11.5px;
    background:rgba(148,163,184,.18);color:var(--ink);text-align:center}
  .body{padding:16px 22px 22px}
  .muted{color:var(--mute);font-size:13px}
  .empty{color:var(--mute);padding:26px 4px;text-align:center}
  .err{color:#fb7185}
  /* the gallery: big enough to see what will print */
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .build{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .build img.cover,.build .noart{display:block;width:100%;aspect-ratio:1;object-fit:contain;cursor:zoom-in;
    background:repeating-conic-gradient(#1b2440 0 25%,#151d35 0 50%) 0 0/16px 16px}
  .build .noart{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;cursor:default}
  .shots{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto}
  .shots img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;flex:0 0 auto}
  .meta{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
  .bt{font-weight:700;font-size:15px;overflow-wrap:anywhere}
  .bs{display:flex;flex-wrap:wrap;gap:5px}
  .pill{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;
    padding:2px 7px;border:1px solid var(--line);color:var(--mute)}
  .pill.ok{border-color:rgba(52,211,153,.45);color:var(--green2)}
  .pill.warn{border-color:rgba(245,158,11,.45);color:#f59e0b}
  /* The drafter's own refusal. Pre-line: these quote a file path and a parser
     error, and folding them into one line loses where the error was. */
  .bwhy{padding:7px 9px;border-radius:7px;font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-line;
    word-break:break-word;color:#fbbf24;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.22)}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .revise{display:none;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
  .revise.on{display:flex}
  textarea{width:100%;min-height:64px;resize:vertical;font:16px var(--sans);color:var(--ink);background:rgba(0,0,0,.25);
    border:1px solid var(--line);border-radius:8px;padding:9px}
  .said{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
  .shop img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
  .vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .vids video{width:100%;border-radius:10px;border:1px solid var(--line);background:#000;display:block}
  #lb{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;padding:18px;background:rgba(3,5,8,.94)}
  #lb.on{display:flex}
  #lb img{max-width:min(100%,900px);max-height:72vh;border-radius:11px;border:1px solid var(--line);
    background:repeating-conic-gradient(#1b2440 0 25%,#151d35 0 50%) 0 0/16px 16px}
  #lb .bar{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  #lb .bar button{padding:8px 12px;border-radius:10px;font:600 12px var(--sans);border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--ink)}
  #lb .bar button.sel{border-color:var(--pink);color:#fff}
  #lb .cap{font-size:13px;color:var(--mute);text-align:center}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;border:1px solid var(--line);
    color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:90vw;display:none;z-index:30}
  @media (max-width:760px){ body{padding:6px} .gal{grid-template-columns:1fr 1fr;gap:10px}
    .head,.body{padding-left:14px;padding-right:14px} .status{margin:0 14px 12px} .tabs{padding:0 10px} }
  @media (max-width:480px){ .gal{grid-template-columns:1fr} }
</style>
<script src="/shared/busy.js"></script>
</head>
<body>
<div class="frame">
  <div class="head">
    <div>
      <h1>Emily's Studio</h1>
      <div class="sub">every design she drew, as a draft in Printify - she never publishes</div>
    </div>
    <div class="sp"></div>
    <a class="btn tt" id="shop" href="/shop">🛍 Shop - TikTok kits and the money board</a>
    <a class="btn" id="back" href="/dashboard">← Deck</a>
    <button class="btn" id="close" style="display:none">✕ Close</button>
  </div>
  <div class="status" id="status"><div class="k">Status</div><div class="line">loading…</div></div>
  <div class="tabs" id="tabs"></div>
  <div class="body" id="body"><div class="empty">loading…</div></div>
</div>
<div id="lb">
  <img id="lbimg" alt="">
  <div class="bar" id="lbbar"></div>
  <div class="cap" id="lbcap"></div>
  <div class="bar"><button id="lbclose">Close</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;

const EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) {
  document.body.classList.add('embed');
  $('back').style.display = 'none';
  $('close').style.display = '';
  // The Shop opens in the same frame; its own Close shuts the frame.
  $('shop').href = '/shop?embed=1';
  const close = () => parent.postMessage({ type: 'emily-close' }, '*');
  $('close').onclick = close;
  addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('lb').classList.contains('on')) closeLb(); else close(); } });
}

let D = null, S = null, JOB = null, tab = 'review', busy = false, open = null;
let builds = [];

const TABS = [
  ['review', 'To review', b => !b.published && !needsRetry(b)],
  ['fix', 'Needs attention', b => needsRetry(b)],
  ['live', 'On Etsy', b => b.published],
  ['all', 'All', () => true],
];

async function getJson(u) {
  try { return await (await fetch(u, { cache: 'no-store' })).json(); }
  catch (e) { return null; }
}

async function load() {
  const was = JSON.stringify([D, S, JOB]);
  [D, S, JOB] = await Promise.all([getJson('/api/emily/builds'), getJson('/api/emily/shop'), getJson('/api/shop/job')]);
  JOB = JOB && JOB.job;
  builds = (D && D.builds) || [];
  // Not while a revision note is being typed - a redraw would wipe it.
  if (!open && JSON.stringify([D, S, JOB]) !== was) draw();
  const running = builds.some(b => (b.retry && b.retry.running) || (b.revision && !b.revision.finished_utc))
    || (JOB && JOB.state === 'running');
  clearTimeout(load.h);
  load.h = setTimeout(load, running ? 6000 : 45000);
}

function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.style.display = 'block';
  clearTimeout(toast.h);
  toast.h = setTimeout(() => { t.style.display = 'none'; }, 6000);
}

// Say plainly whether a build is finished and whether the art is real. A
// placeholder thumbnail looks like art until you open it.
function buildPills(b) {
  const p = [];
  // The words come from the API (emily.js statusWords), shared with the Deck.
  const w = b.status_words || { label: String(b.status).replace(/_/g, ' ') };
  if (b.published) p.push(['ok', 'on Etsy']);
  else if (b.status === 'ready_for_review') p.push(['ok', 'ready']);
  else p.push([w.warn ? 'warn' : '', w.label]);
  if (b.product_type) p.push(['', b.product_type]);
  if (b.art_mode === 'placeholder') p.push(['warn', 'placeholder']);
  if (b.listing_error) p.push(['warn', 'listing unreadable']);
  return p.map(([c, t]) => `<span class="pill ${c}">${esc(t)}</span>`).join('');
}

// Why there is no Printify draft, in the drafter's own words.
function blockedReason(b) {
  if (b.published || b.printify) return '';
  if (b.status_words && b.status_words.note) return b.status_words.note;
  if (b.draft_blocked && b.draft_blocked.reason) return b.draft_blocked.reason;
  if (b.listing_error) return `listing.json will not parse — ${b.listing_error}`;
  return '';
}

// A build that did not come out - no real art (the day's money ran out
// mid-drawing), or no Printify draft - gets a Try again button. Which step
// it redoes is emily-finish.py --retry's decision. Owner, 2026-10-15.
function needsRetry(b) {
  return !b.published && (b.art_mode === 'placeholder' || !b.images.length || !b.printify || !!b.draft_blocked);
}

function progress(b) {
  const r = b.retry, v = b.revision;
  if (r && r.running) return `<div class="said">⏳ Trying again… a drawing takes a minute or two.</div>`;
  if (v && !v.finished_utc) return `<div class="said">⏳ Revising since ${esc(v.requested_utc)} UTC… a redraw takes a few minutes.</div>`;
  const out = [];
  if (v && v.finished_utc) out.push(`<div class="said ${v.ok ? '' : 'err'}">Last revision ${v.ok ? 'done' : 'did not finish'}: ${esc(v.said || '')}</div>`);
  if (r && r.said) out.push(`<div class="said ${r.ok ? '' : 'err'}">${esc(r.said)}</div>`);
  return out.join('');
}

function acts(b) {
  const working = busy || (b.retry && b.retry.running) || (b.revision && !b.revision.finished_utc);
  const dis = working ? 'disabled' : '';
  if (b.published) {
    return `<div class="acts">${b.etsy_url ? `<a class="btn" href="${esc(b.etsy_url)}" target="_blank" rel="noopener">On Etsy ↗</a>` : ''}
      ${b.printify_url ? `<a class="btn" href="${esc(b.printify_url)}" target="_blank" rel="noopener">Printify ↗</a>` : ''}</div>`;
  }
  return `<div class="acts">
      ${needsRetry(b) ? `<button class="btn go" data-retry="${esc(b.slug)}" ${dis}>↻ Try again</button>` : ''}
      <button class="btn" data-revise="${esc(b.slug)}" ${dis}>↺ Request revision</button>
      ${b.printify_url ? `<a class="btn" href="${esc(b.printify_url)}" target="_blank" rel="noopener">Printify ↗</a>` : ''}
      <button class="btn warn" data-delete="${esc(b.slug)}" ${dis}>🗑 Delete</button></div>
    <div class="revise ${open === b.slug ? 'on' : ''}" id="rev-${esc(b.slug)}">
      <textarea placeholder="What should change? e.g. dark colours, bigger lettering, no white" maxlength="300"></textarea>
      <div class="acts"><button class="btn tt" data-redo="${esc(b.slug)}">Redraw the art (one image call)</button>
        <button class="btn" data-redraft="${esc(b.slug)}">Redraft the same art (free)</button></div>
      <div class="said">Your note is added to the brief the art is drawn from. Redraw replaces the old Printify draft; redraft keeps the art and fixes the placement only.</div>
    </div>`;
}

function card(b) {
  const cover = b.images[0];
  const shot = cover
    ? `<img class="cover" loading="lazy" src="${cover.url}" alt="${esc(b.title)}" data-lb="${esc(b.slug)}" data-name="${esc(cover.name)}">`
    : '<div class="noart">no image yet</div>';
  const shots = b.images.length > 1 ? `<div class="shots">${b.images.map(f =>
    `<img loading="lazy" src="${f.url}" alt="${esc(f.name)}" data-lb="${esc(b.slug)}" data-name="${esc(f.name)}">`).join('')}</div>` : '';
  return `<div class="build">${shot}${shots}<div class="meta">
    <div class="bt">${esc(b.title)}</div>
    <div class="bs">${buildPills(b)}</div>
    ${blockedReason(b) ? `<div class="bwhy">${esc(blockedReason(b))}</div>` : ''}
    ${progress(b)}
    ${acts(b)}
  </div></div>`;
}

function drawShop() {
  if (!S) return '';
  const banner = S.banner
    ? `<a href="/api/emily/shop/banner.png?v=${enc(S.banner.updated_at)}" target="_blank"><img src="/api/emily/shop/banner.png?v=${enc(S.banner.updated_at)}" alt="shop banner"></a>
       <div class="muted" style="margin-top:6px">Tap it to open full size, press and hold to save, then Etsy › Shop Manager › Edit shop › Banner.</div>`
    : `<div class="muted">Not drawn yet. On the droplet: <code>python3 scripts/emily-banner.py</code></div>`;
  const videos = S.videos || [];
  const vids = videos.length
    ? `<div class="vids">${videos.map(v => {
        const src = `/api/emily/shop/video/${enc(v.listing_id)}?v=${enc(v.updated_at)}`;
        return `<div><div style="font-weight:600;font-size:13px;margin-bottom:6px">${esc(v.title || 'listing ' + v.listing_id)}</div>
          <video src="${src}" controls muted playsinline preload="metadata"></video>
          <div class="acts" style="margin-top:6px"><a class="btn" href="/api/emily/shop/video/${enc(v.listing_id)}?dl=1" download="listing-${esc(v.listing_id)}.mp4">Download</a></div></div>`;
      }).join('')}</div><div class="muted" style="margin-top:8px">On Etsy: Edit listing › Photos and video › add the downloaded file.</div>`
    : `<div class="muted">None made yet. On the droplet: <code>python3 scripts/listing-video.py all</code></div>`;
  return `<div class="shop"><h2 style="font-size:17px;margin:4px 0 10px">Shop banner</h2>${banner}
    <h2 style="font-size:17px;margin:22px 0 10px">Listing videos</h2>${vids}</div>`;
}

function draw() {
  if (!D) { $('body').innerHTML = '<div class="empty err">The Deck could not be reached.</div>'; return; }
  const c = D.counts || {};
  const fix = builds.filter(needsRetry).length;
  $('status').innerHTML = `<div class="k">Status</div>
    <div class="line">${builds.length} design${builds.length === 1 ? '' : 's'} · ${c.ready_for_review || 0} ready for review${
      fix ? ` · ${fix} need attention` : ''} · ${c.published || 0} on Etsy</div>
    <div class="muted">Approve ideas in Scout's house; publishing and prices are yours, in Printify.</div>
    ${JOB ? `<div class="muted ${JOB.state === 'failed' ? 'err' : ''}">${JOB.state === 'running' ? '⏳' : JOB.state === 'failed' ? '✕' : '✓'} ${esc(JOB.label)}</div>` : ''}`;
  $('tabs').innerHTML = TABS.map(([k, l, f]) =>
    `<button class="tab ${tab === k ? 'on' : ''}" data-t="${k}">${l}<span class="n">${builds.filter(f).length}</span></button>`).join('')
    + `<button class="tab ${tab === 'shop' ? 'on' : ''}" data-t="shop">Banner &amp; videos</button>`;
  if (tab === 'shop') { $('body').innerHTML = drawShop(); return; }
  if (!builds.length) {
    $('body').innerHTML = '<div class="empty">Nothing built yet. Approve one of Scout’s ideas and Emily starts a build.</div>';
    return;
  }
  const f = (TABS.find(t => t[0] === tab) || TABS[3])[2];
  const list = builds.filter(f);
  $('body').innerHTML = list.length ? `<div class="gal">${list.map(card).join('')}</div>`
    : `<div class="empty">Nothing here.</div>`;
}

// ------------------------------------------------------------ lightbox

let lbFiles = [];
function openLb(slug, start) {
  const b = builds.find(x => x.slug === slug);
  if (!b || !b.images.length) return;
  lbFiles = b.images;
  $('lbbar').innerHTML = lbFiles.map((f, n) => `<button data-show="${n}">${esc(f.name)}</button>`).join('');
  $('lbcap').textContent = b.title;
  showLb(Math.max(0, lbFiles.findIndex(f => f.name === start)));
  $('lb').classList.add('on');
}
function showLb(i) {
  $('lbimg').src = lbFiles[i].url;
  $('lbimg').alt = lbFiles[i].name;
  [...$('lbbar').children].forEach((b, n) => b.className = n === i ? 'sel' : '');
}
function closeLb() { $('lb').classList.remove('on'); $('lbimg').src = ''; }
$('lb').onclick = e => {
  if (e.target.id === 'lb' || e.target.id === 'lbclose') return closeLb();
  const s = e.target.closest('[data-show]');
  if (s) showLb(+s.dataset.show);
};

// ------------------------------------------------------------ actions

async function post(path, body, method = 'POST') {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  let j = {};
  try { j = await r.json(); } catch { /* not JSON */ }
  return { ok: r.ok, status: r.status, j };
}

async function act(fn) {
  if (busy) return;
  busy = true; draw();
  try { await fn(); } catch (e) { toast('The Deck could not be reached'); }
  busy = false;
  await load();
  draw();
}

$('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; open = null; draw(); } };
$('body').onclick = e => {
  const im = e.target.closest('[data-lb]');
  if (im) return openLb(im.dataset.lb, im.dataset.name);
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;
  if (d.retry) {
    const b = builds.find(x => x.slug === d.retry);
    const art = b && (b.art_mode === 'placeholder' || !b.images.length);
    if (!confirm(art ? 'Draw this design again and make its Printify draft? One drawing costs a few cents.'
                     : 'Make the Printify draft from this art again? This costs nothing.')) return;
    return act(async () => {
      const r = await post(`/api/emily/builds/${enc(d.retry)}/retry`);
      toast(r.ok ? 'Trying again - the card updates when it is done' : (r.j.error || 'That did not work.'));
    });
  }
  if (d.revise) { open = open === d.revise ? null : d.revise; return draw(); }
  if (d.redo || d.redraft) {
    const slug = d.redo || d.redraft;
    const note = (document.querySelector(`#rev-${CSS.escape(slug)} textarea`) || {}).value || '';
    if (d.redo && !confirm('Draw this art again? That is one image call (a few cents), and the old Printify draft is replaced.')) return;
    open = null;
    return act(async () => {
      const r = await post(`/api/shop/board/${enc(slug)}/revise`, { note, keep_art: !!d.redraft });
      toast(r.ok ? 'Sent back - the card updates when it is done' : (r.j.error || 'could not start'));
    });
  }
  if (d.delete) {
    if (!confirm('Delete this design? Its unpublished draft in Printify is deleted too, if it is still there. Anything on sale on Etsy is never deleted.')) return;
    return act(async () => {
      const r = await post(`/api/emily/builds/${enc(d.delete)}`, {}, 'DELETE');
      toast(r.ok ? 'Deleted' : `Not deleted: ${r.j.error || 'failed'}`);
    });
  }
};
load();
</script>
</body>
</html>
