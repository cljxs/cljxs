    const r = await fetch(`/api/reports/${encodeURIComponent(docAgent)}/${encodeURIComponent(file)}`, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    $('docwhen').textContent = new Date(d.written_at).toLocaleString();
    $('docbody').innerHTML = mdToHtml(d.markdown);
  }catch(e){
    $('docbody').innerHTML = `<div class="muted">Could not load that report: ${esc(e.message)}</div>`;
  }
}
/* ---------------- Ace's betting console ---------------- */

const pctTxt2 = v => v === null || v === undefined ? '—' : `${v >= 0 ? '+' : ''}${v.toFixed(1)}%`;
const priceTxt = v => v === null || v === undefined ? '—' : (v > 0 ? `+${v}` : `${v}`);

function miniTable(title, rows, label){
  if(!rows || !rows.length) return '';
  return `<div class="box"><div class="l">${esc(title)}</div>` + rows.slice(0,6).map(r =>
    `<div class="rowline"><span>${esc(r.key)}</span><span>${r.rows}${
      r.settled ? ` · ${r.hit_pct}% of ${r.settled}` : ''}</span></div>`).join('') + '</div>';
}

// ------------------------------------------------- player forecasts
//
// A forecast is a probability and nothing else. There is no price in the
// payload and none is shown: "my number says 70, the line says 60" is the
// reasoning Ace's instructions open by forbidding, and a card that put the
// two side by side would be inviting it. NOT A BET is on every one of these
// for the same reason it is printed by the script that writes them.

function fcTile(label, pct, on, band){
  // The interval rides under every tile, not just the shaky ones. "76% off
  // fifteen games" and "76% off a hundred" are different claims and a card
  // that printed them identically would be making the weaker one look like
  // the stronger.
  const range = Array.isArray(band)
    ? `<div class="fctr num">${Math.round(band[0])}–${Math.round(band[1])}</div>` : '';
  return `<div class="fct${on ? ' on' : ''}"><div class="fctl">${esc(label)}</div>`
       + `<div class="fctv num">${pct === undefined || pct === null ? '—' : Number(pct).toFixed(1) + '%'}</div>`
       + range + `</div>`;
}

function forecastCard(f){
  const probs = f.probabilities || {};
  const keys = Object.keys(probs).map(Number).sort((x, y) => x - y);
  // The headline is the middle threshold, the way his cards lead with 60+.
  const lead = keys.length ? keys[Math.floor((keys.length - 1) / 2)] : null;
  // The unit comes off the row: these are no longer all yards, and a card
  // reading "FINAL 6 yds" under a receptions forecast would be a lie the
  // script it came from does not tell.
  const unit = f.unit || 'yds';
  const graded = f.actual !== null && f.actual !== undefined;

  const band = f.interval || {};
  const tiles = keys.map(t => fcTile(t + '+', probs[String(t)], t === lead,
                                     band[String(t)])).join('');
  const hit = graded && lead !== null ? Number(f.actual) >= lead : null;

  return `<div class="fcard${graded ? ' done' : ''}">
    <div class="fchead">
      <div>
        <div class="fclabel">MODEL FORECAST · NOT A BET</div>
        <div class="fcname">${esc(f.player)}</div>
        <div class="fcsub">${esc(f.team || '')} · ${esc((f.market || '').replace(/_/g, ' '))}${
          lead !== null ? ' · ' + lead + '+' : ''}</div>
      </div>
      <div class="fcbig num">${lead === null ? '—' : Number(probs[String(lead)]).toFixed(1) + '%'}
        <div class="fcbigl">${lead === null ? '' : lead + '+'}${
          Array.isArray(band[String(lead)])
            ? ` · ${Math.round(band[String(lead)][0])}–${Math.round(band[String(lead)][1])}`
            : ''}</div></div>
    </div>
    <div class="fctiles">${tiles}</div>
    <div class="fcfoot">
      <span>EXP ${f.sample_mean === undefined ? '—' : Number(f.sample_mean).toFixed(1)} ${esc(unit)}</span>
      <span>P25–P75 ${f.p25 ?? '—'}–${f.p75 ?? '—'}</span>
      <span>${f.sample_games ?? '?'} GAMES</span>
      ${f.availability && f.availability.thin
        ? `<span class="fcwarn">PLAYED ${f.availability.played}/${f.availability.team_games}</span>` : ''}
      ${f.coarse ? `<span class="fcwarn">FLAT</span>` : ''}
      ${f.line && f.line.shown ? `<span class="fcline">${esc(f.line.shown)}</span>` : ''}
      ${f.injury && f.injury.status
        ? `<span class="fcwarn">\u26a0 ${esc(String(f.injury.status).toUpperCase())}${
            f.injury.date ? ' ' + esc(String(f.injury.date).slice(5)) : ''}</span>` : ''}
    </div>
    ${graded ? `<div class="fcres ${hit ? 'up' : 'down'}">
        FINAL ${Number(f.actual).toFixed(0)} ${esc(unit)} · ${lead}+ ${hit ? 'HIT' : 'MISS'}</div>`
      : `<div class="fcres pend">awaiting the final score</div>`}
  </div>`;
}

/* ---------------- the props hall ----------------
 * One screen per market. They were all on one scroll inside Ace's house,
 * which put a quarterback's passing yards and a tight end's targets in the
 * same list - seven different questions reading as one long answer. The tabs
 * are built from the catalogue the forecaster writes, never from a list kept
 * here: a market added in MARKETS has to appear here without anyone
 * remembering to add it.
 */

let PROPS = null;          // the last payload, so switching tabs is instant
let propsTab = null;
let WEEK = null;           // this week's games, from props-forecast.py week
let propsEvent = null;     // the game picked, or null for every forecast
let propsPoll = null;

function openPropsPanel(){
  openAgent = PROPS_DOOR;
  $('card').innerHTML = `
    <h2>${esc(PROPS_DOOR)}</h2>
    <div class="sub">model forecasts · no odds are held or shown</div>
    <div class="sect">This week's games</div>
    <input id="gsearch" class="gsearch" type="search" autocomplete="off"
           placeholder="search a team - packers, GB, chiefs…">
    <div id="gameList"><div class="muted">loading this week…</div></div>
    <div id="propsRun"></div>
    <div id="propsBody"><div class="muted">loading the forecasts…</div></div>
    <button id="close">Close</button>`;
  $('card').className = 'wide';
  $('panel').style.display = 'flex';
  $('close').onclick = closePanel;
  $('gsearch').oninput = drawWeek;
  // One listener for every game button. Inline onclick strings would put the
  // fixture inside a quoted attribute, and esc() does not escape quotes.
  $('gameList').onclick = e => {
    const b = e.target.closest('[data-event]');
    if(b) pickGame(b.dataset.event);
  };
  $('propsRun').onclick = e => {
    const b = e.target.closest('[data-rerun]');
    if(b) runForecast(b.dataset.rerun);
  };
  loadWeek();
  loadProps();
}

function gameOf(id){ return ((WEEK && WEEK.games) || []).find(g => g.event_id === id) || null; }

async function loadWeek(){
  try{
    const r = await fetch('/api/props/week', {cache:'no-store'});
    WEEK = await r.json();
  }catch(e){ WEEK = {available:false, reason:'the Deck could not be reached', games:[]}; }
  drawWeek();
  // A run started earlier - from this tablet or another - is picked up
  // rather than forgotten because the panel was closed.
  const job = WEEK && WEEK.job;
  if(job && job.state === 'running'){ propsEvent = propsEvent || job.event_id; watchJob(); }
}

function drawWeek(){
  const host = $('gameList');
  if(!host) return;
  if(!WEEK || !WEEK.available){
    host.innerHTML = `<div class="muted">${esc((WEEK && WEEK.reason) || 'no games this week')}</div>`;
    return;
  }
  const q = (($('gsearch') || {}).value || '').trim().toLowerCase();
  const games = WEEK.games.filter(g => !q || [g.fixture, g.away, g.home, g.away_name, g.home_name]
    .some(x => String(x || '').toLowerCase().includes(q)));
  if(!games.length){ host.innerHTML = `<div class="muted">no game this week matches "${esc(q)}".</div>`; return; }
  const days = [];
  for(const g of games){
    const d = g.day_et || '?';
    if(!days.length || days[days.length - 1][0] !== d) days.push([d, []]);
    days[days.length - 1][1].push(g);
  }
  host.innerHTML = (WEEK.week ? `<div class="muted">NFL week ${esc(WEEK.week)}</div>` : '')
    + days.map(([d, gs]) => `<div class="gday">${esc(d)}</div><div class="glist">`
      + gs.map(g => {
          const when = g.state === 'post' ? 'FINAL' : g.state === 'in' ? 'LIVE' : (g.time_et || '');
          const done = g.forecast_rows ? ` · <span class="gok">\u2713 ${g.forecast_rows}</span>` : '';
          return `<button class="gbtn${g.event_id === propsEvent ? ' on' : ''}" data-event="${esc(g.event_id)}">`
               + `${esc(g.fixture)}<span class="gt">${esc(when)}${done}</span></button>`;
        }).join('') + `</div>`).join('');
}

function pickGame(id){
  propsEvent = id;
  drawWeek();
  const g = gameOf(id);
  // Already forecast: show it, and offer a re-run for when the injury report
  // has moved. Not yet: run it - that is what the click was for.
  if(g && g.forecast_rows){
    drawRunBar(null, g);
    drawProps();
  } else {
    runForecast(id);
  }
}

function drawRunBar(job, g){
  const host = $('propsRun');
  if(!host) return;
  const name = esc((g && g.fixture) || (job && job.fixture) || '');
  if(job && job.state === 'running'){
    host.innerHTML = `<div class="grun">Forecasting <b>${name}</b>… reading two seasons of
      game logs from ESPN for every player. Usually well under a minute.</div>`;
    return;
  }
  const log = job && job.log
    ? `<details><summary>what the script said</summary><pre>${esc(job.log)}</pre></details>` : '';
  const head = job && job.state === 'failed'
    ? `The forecast for <b>${name}</b> did not finish (exit ${esc(job.code)}).`
    : `<b>${name}</b>` + (g && g.forecast_rows ? ` · ${g.forecast_rows} forecast rows` : '');
  host.innerHTML = `<div class="grun">${head}`
    + (g ? `<button data-rerun="${esc(g.event_id)}">Re-run</button>` : '')
    + `<div class="muted" style="margin-top:6px">Re-run after the injury report moves - about
       90 minutes before kickoff the inactives are final.</div>${log}</div>`;
}

async function runForecast(id){
  const g = gameOf(id);
  propsEvent = id;
  drawWeek();
  let r, d;
  try{
    r = await fetch('/api/props/forecast', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({event_id: id, fixture: g ? g.fixture : ''})});
    d = await r.json();
  }catch(e){ drawRunBar({state:'failed', code:'-', log:'the Deck could not be reached'}, g); return; }
  if(r.status === 409){
    const host = $('propsRun');
    if(host) host.innerHTML = `<div class="grun">${esc(d.error)} - one at a time, because two runs
      would write over each other's forecasts. This one will be ready in a minute.</div>`;
    watchJob();
    return;
  }
  if(!r.ok){ drawRunBar({state:'failed', code:r.status, log:d.error || ''}, g); return; }
  drawRunBar(d.job, g);
  watchJob();
}

function watchJob(){
  clearInterval(propsPoll);
  propsPoll = setInterval(async () => {
    // The panel was closed or turned into another house: stop asking.
    if(!$('propsRun')){ clearInterval(propsPoll); return; }
    let job;
    try{ job = (await (await fetch('/api/props/job', {cache:'no-store'})).json()).job; }
    catch(e){ return; }
    if(!job || job.state === 'running'){
      if(job && job.event_id === propsEvent) drawRunBar(job, gameOf(job.event_id));
      return;
    }
    clearInterval(propsPoll);
    await loadWeek();                 // the row counts have changed
    if(job.event_id === propsEvent) drawRunBar(job, gameOf(job.event_id));
    loadProps();
  }, 3000);
}

async function loadProps(){
  const host = $('propsBody');
  if(!host) return;
  try{
    const r = await fetch('/api/ace/forecasts', {cache:'no-store'});
    PROPS = await r.json();
  }catch(e){
    host.innerHTML = `<div class="muted">the forecasts could not be read.</div>`;
    return;
  }
  if(!PROPS.available || !(PROPS.forecasts || []).length){
    host.innerHTML = `<div class="muted">Nothing forecast yet. Pick a game above and it
      will run.</div>`;
    return;
  }
  const tabs = propsTabs();
  if(!tabs.includes(propsTab)) propsTab = tabs[0] || null;
  drawProps();
}

// The tab order is the catalogue's order. Markets with no forecasts still get
// a tab: "nobody qualified for this one today" and "this market does not
// exist" are different, and a missing tab says the second.
function propsTabs(){
  const cat = Object.keys((PROPS && PROPS.markets) || {});
  if(cat.length) return cat;
  // No catalogue in the payload - an older forecasts.json. Fall back to what
  // the rows themselves carry rather than showing no tabs at all.
  return [...new Set((PROPS.forecasts || []).map(f => f.market))];
}

function propsPick(tab){ propsTab = tab; drawProps(); }

function marketLabel(m){ return String(m || '').replace(/_/g, ' '); }

// The forecasts in view: the picked game's, or every game's until one is
// picked. One filter, used by the tab counts and the cards alike, so a tab
// can never promise rows the list then does not show.
function propsInView(){
  const all = (PROPS && PROPS.forecasts) || [];
  return propsEvent ? all.filter(f => String(f.event_id) === String(propsEvent)) : all;
}

function drawProps(){
  const host = $('propsBody');
  if(!host || !PROPS) return;
  const tabs = propsTabs();
  const rows = propsInView().filter(f => f.market === propsTab);
  const spec = ((PROPS.markets || {})[propsTab]) || {};
  const graded = rows.filter(f => f.actual !== null && f.actual !== undefined).length;

  const bar = tabs.map(t => {
    const n = propsInView().filter(f => f.market === t).length;
    return `<button class="ptab${t === propsTab ? ' on' : ''}" onclick="propsPick('${esc(t)}')">`
         + `${esc(marketLabel(t))}<span class="ptn">${n}</span></button>`;
  }).join('');

  const bars = Array.isArray(spec.thresholds)
    ? spec.thresholds.map(t => `${t}+`).join(' · ') : '';

  host.innerHTML = `<div class="ptabs">${bar}</div>`
    + `<div class="sect">${esc(marketLabel(propsTab))}${bars ? ' · ' + esc(bars) : ''}${
        spec.unit ? ' ' + esc(spec.unit) : ''}</div>`
    + (rows.length
        ? `<div class="muted" style="margin-bottom:10px">${rows.length} forecast${
            rows.length === 1 ? '' : 's'}${graded ? ` · ${graded} graded` : ''}. Each
            percentage carries its 90% interval — how far it moves when his own games
            are resampled, so a small sample says so rather than reading like a big one.
            A percentage is what he does <em>when he plays</em>; PLAYED n/m marks the rows
            where that is a different question from the one a book prices. Where a
            sportsbook has posted a line it is shown in blue for reference - it is not a
            price, and no percentage here was computed from it.</div>`
          + `<div class="fcards">` + rows.map(forecastCard).join('') + `</div>`
        : `<div class="muted">Nobody on the fixtures forecast so far reaches
           ${esc(marketLabel(propsTab))} in a quarter of his games. That is the filter
           working rather than a gap — a market a player barely touches would print
           four zeroes and bury the rows that mean something.</div>`);
}

async function loadAceLedger(){
  const host = $('aceLedger');
  if(!host) return;
  let d;
  try{
    const r = await fetch('/api/ace/ledger', {cache:'no-store'});
    d = await r.json();
  }catch(e){ host.innerHTML = `<div class="muted">Could not load the ledger.</div>`; return; }

  if(!d.available){
    host.innerHTML = `<div class="muted">${esc(d.reason || 'No ledger yet.')}</div>`;
    return;
  }

  const b = d.bankroll;
  let out = '';

  if(d.verdict){
    out += `<div class="verdict"><b>${esc(d.verdict)}</b>${
      d.slot ? `<div class="muted" style="margin-top:4px">${esc(d.day || '')} · ${esc(d.slot)}</div>` : ''}</div>`;
  }

  if(b){
    out += `<div class="sect">Bankroll · paper</div>
      <div class="grid">
        <div class="stat"><div class="l">Bankroll</div><div class="v num">${money(b.cash)}</div>
          ${b.pnl_pct !== null ? `<div class="l ${cls(b.pnl)}">${pctTxt(b.pnl_pct)}</div>` : ''}</div>
        <div class="stat"><div class="l">Open bets</div><div class="v num">${b.open_count}</div>
          <div class="l">${b.settled_count} settled</div></div>
      </div>`;
  }

  out += `<div class="sect">Candidates tracked · ${d.counts.candidates}</div>`;
  if(!d.candidates.length){
    out += `<div class="muted">Nothing on the slate this cycle.</div>`;
  } else {
    out += `<div class="board"><table><thead><tr>
        <th>Selection</th><th class="num">Price</th><th class="num">No-vig</th>
        <th class="num">Mine</th><th class="num">Edge</th><th class="num">EV</th><th>Why not a pick</th><th>Status</th>
      </tr></thead><tbody>` + d.candidates.map(c => `<tr>
        <td><div class="sel">${esc(c.selection)}</div>${
          c.match ? `<div class="mt">${esc(c.match)}</div>` : ''}${
          c.sport ? `<div class="mt">${esc(c.sport)}</div>` : ''}</td>
        <td class="num">${priceTxt(c.price)}</td>
        <td class="num">${c.novig_pct === null ? '—' : c.novig_pct.toFixed(1) + '%'}</td>
        <td class="num">${c.my_pct === null ? '—' : c.my_pct.toFixed(1) + '%'}</td>
        <td class="num">${c.edge_pts === null ? '—' : pctTxt2(c.edge_pts).replace('%','')}</td>
        <td class="num ${c.clears_bar ? 'up' : ''}">${c.ev_pct === null ? '—' : pctTxt2(c.ev_pct)}</td>
        <td class="why">${c.why_not.length ? esc(c.why_not.join(', ')) : '—'}</td>
        <td><span class="tagp ${esc(c.status)}">${esc(c.status)}</span></td>
      </tr>`).join('') + `</tbody></table></div>`;
  }

  if(d.settled_bets.length){
    out += `<div class="sect">Results</div><div class="board"><table><thead><tr>
        <th>Bet</th><th class="num">Stake</th><th>Result</th></tr></thead><tbody>` +
      d.settled_bets.slice(0,10).map(x => `<tr>
        <td><div class="sel">${esc(x.selection || x.pick || x.match || 'bet')}</div>${
          x.note ? `<div class="mt">${esc(x.note)}</div>` : ''}</td>
        <td class="num">${x.stake === undefined ? '—' : money(x.stake)}</td>
        <td><span class="tagp ${esc(x.result || '')}">${esc(x.result || 'open')}</span></td>
      </tr>`).join('') + `</tbody></table></div>`;
  } else {
    out += `<div class="sect">Results</div><div class="muted">Nothing settled yet.</div>`;
  }

  const minis = [
    miniTable('Criterion that failed', d.by_reason),
    miniTable('By sport', d.by_sport),
    miniTable('By status', d.by_status),
  ].filter(Boolean).join('');
  if(minis) out += `<div class="sect">How the discipline is holding</div><div class="mini">${minis}</div>`;

  host.innerHTML = out;
}

const clock = sec => {
  const t = Math.max(0, Math.floor(sec || 0)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s2 = t % 60;

  catch (e) { CLIP = { installed: false, error: e.message }; }

      <b>python3 -m clipper youtube-login</b>. Approving still works — the post waits and goes out after you

// The Twitch watcher's clips (made on your account, for you to download),
// the past-broadcast moments viewers clipped (for you to clip), and what
// the Dropbox pickup brought in. Links come from Twitch's API: only https.
const httpsOnly = u => /^https:\/\//.test(u || '') ? esc(u) : '#';
const utcAgo = ts => ts ? ago(Math.round((Date.now() - Date.parse(ts.replace(' ', 'T') + (ts.endsWith('Z') ? '' : 'Z'))) / 60000)) : '';
function drawTwitch(tw){
  let h = '';
  const chans = tw.channels || [];
  if (!tw.ready) {
    h += `<div class="verdict">The Twitch watcher isn't signed in yet. Setup is in <b>clipper/README.md</b>
      ("Twitch"), ending with <b>python3 -m clipper twitch-login</b>.</div>`;
  } else if (!chans.length) {
    h += `<div class="muted">No channel to watch yet: <b>python3 -m clipper source rules NAME --twitch LOGIN</b></div>`;
  } else {
    h += `<div class="muted">Watching <b>${esc(chans.join(', '))}</b> whenever live: when chat explodes, Clip clips
      the last minute on your account.</div>`;
  }
  const clips = tw.clips || [];
  const clipRow = k => {
    const pill = k.best ? 'ok' : '';
    const words = (k.words || []).slice(0, 3).map(w => esc(w[0]) + ' ×' + w[1]).join(', ');
    return `<div class="w">${esc(utcAgo(k.created_at))} · <b>${esc(k.channel)}</b>
      · chat ${k.chat_rate}/s (usual ${k.chat_usual}/s)${words ? ' · ' + words : ''}
      <span class="pill ${pill}">${k.best ? 'best · ' + k.jump + '×' : k.jump ? k.jump + '×' : esc(k.status)}</span>
      ${k.vod_link ? `<a href="${httpsOnly(k.vod_link)}" target="_blank" rel="noopener"><b>Clip it at ${clock(k.vod_offset)}</b></a>`
                   : '<span class="muted">broadcast link after the stream</span>'}
      ${k.url ? ` · <a href="${httpsOnly(k.url)}" target="_blank" rel="noopener">watcher's clip</a>` : ''}
      ${k.detail ? `<div class="muted">${esc(k.detail)}</div>` : ''}</div>`;
  };
  if (clips.length) {
    h += `<div class="muted" style="margin:6px 0">For each <b>best</b> moment: tap <b>Clip it</b> — his past
      broadcast opens a minute before it — play, press <b>Clip</b>, publish, then download it (dashboard.twitch.tv →
      Content → Clips → Share → Download → Landscape) into your Dropbox folder. Clip takes it from there.
      Ranked by how far chat jumped above its usual pace.</div>`;
    for (const st of tw.streams || []) {
      const mine = clips.filter(k => k.channel === st.channel && k.stream_started_at === st.started_at);
      const top = mine.filter(k => k.best), rest = mine.filter(k => !k.best);
      h += `<div class="muted" style="margin:8px 0 4px"><b>${esc(st.channel)}</b>, stream of
        ${esc(utcAgo(st.started_at))}: ${st.made} clip(s), best ${st.best}</div>` + top.map(clipRow).join('')
        + (rest.length ? `<details><summary class="muted">${rest.length} more, smaller jumps</summary>`
           + rest.map(clipRow).join('') + `</details>` : '');
    }
  } else if (tw.ready && chans.length) {
    h += `<div class="muted">No clips yet — they appear here the morning after a stream.</div>`;
  }
  const moments = tw.moments || [];
  if (moments.length) {
    h += `<div class="muted" style="margin:10px 0 6px">Clip these yourself — the most-viewed moments of recent
      past broadcasts (open it, press Clip, then download it the same way):</div>` + moments.map(m => `
      <div class="w"><a href="${httpsOnly(m.link)}" target="_blank" rel="noopener">${esc(m.title || 'untitled')}</a>
        · ${big(m.views)} views · at ${clock(m.vod_offset)} · clipped by ${esc(m.creator || '?')}</div>`).join('');
  }
  if (!tw.dropbox_ready) {
    h += `<div class="verdict" style="margin-top:8px">Dropbox pickup isn't set up: Clip needs a Dropbox app's key and
      secret (clipper/README.md, "Dropbox folder pickup").</div>`;
  } else if (!(tw.folders || []).length) {
    h += `<div class="muted" style="margin-top:8px">No Dropbox folder yet: <b>python3 -m clipper source rules NAME
      --dropbox-folder LINK</b></div>`;
  }
  const picks = tw.pickups || [];
  if (picks.length) {
    h += `<div class="muted" style="margin:10px 0 6px">Picked up from Dropbox (${esc((tw.folders || []).join(', '))}):</div>`
      + picks.map(p => `<div class="w">${esc(p.path)} · <span class="pill ${p.status === 'ingested' ? 'ok' : ''}">${esc(p.status)}</span>
        ${esc(p.detail || '')} · ${esc(utcAgo(p.seen_at))}</div>`).join('');
  }
  return h;
}

// The words a clip posts with, and - once approved - where each post went.
function drawPost(k){
  const p = k.post;
  const words = !p ? '<div class="muted">No title or caption yet.</div>' : `
    <div class="w"><b>${esc(p.title)}</b></div>
    ${p.caption !== p.title ? `<div class="muted">${esc(p.caption)}</div>` : ''}
    <div class="ktags">${(p.hashtags || []).map(t => `<span class="pill">#${esc(t)}</span>`).join('')}</div>
    <div class="muted" style="font-size:11px">${p.generator === 'owner' ? 'your words'
      : p.generator === 'template' ? 'plain draft (no model used)' : 'drafted by ' + esc(p.generator.slice(4))}</div>`;
  const dl = `<a href="/api/clip/file/${k.video_id}/${k.rank}?dl=1">Download</a>`;
  if (k.status === 'rejected') return words + `<div class="ktags"><span class="pill">rejected</span></div>`;
  if (k.status === 'rendered') {
    return words + `<div class="acts clipacts">
        <button class="yes" data-clip="approve" data-id="${k.id}">Approve &amp; post</button>
        <button data-clip="edit" data-id="${k.id}">Edit text</button>
        <button data-clip="redraft" data-id="${k.id}">New draft</button>
        <button class="no" data-clip="reject" data-id="${k.id}">Reject</button></div>
      <div class="muted">${dl}</div>`;
  }
  const pubs = (k.publications || []).map(u => {
    const name = u.platform === 'youtube' ? 'YouTube' : 'TikTok';
    if (u.status === 'posted') {
      return `<div class="w" style="color:var(--up)">${name}: posted${u.privacy ? ' (' + esc(u.privacy) + ')' : ''}
        ${u.url ? `· <a href="${esc(u.url)}" target="_blank" rel="noopener">open</a>` : ''}</div>`;
    }
    if (u.status === 'manual') {
      return `<div class="w">${name}: ready for you — ${dl} ·
        <a href="#" data-clip="copytiktok" data-id="${k.id}">Copy caption</a> ·
        <a href="#" data-clip="posted" data-id="${k.id}" data-platform="${u.platform}">Mark posted</a></div>`;
    }
    return `<div class="w" style="color:#f59e0b">${name}: ${esc(u.status.replace('_', ' '))} — ${esc(u.detail || '')}</div>`;
  }).join('');
  return words + pubs;
}

// Clipboard: navigator.clipboard exists only on https, and the Deck is plain
// http over Tailscale - so the old select-and-copy path is the one that runs.
function copyText(text){
  const t = document.createElement('textarea');
  t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  t.remove();
  if (!ok) window.prompt('Copy this caption:', text);
  else alert('Caption copied - paste it into TikTok.');
}

async function clipPost(url, body){
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                               body: JSON.stringify(body || {}) });
  const j = await r.json();
  alert((j.message || j.error || (r.ok ? 'Done.' : 'That did not work.')).slice(0, 600));
}

// Resolves with {title, caption, tags}, or null when cancelled.
function editPost(post){
  return new Promise(resolve => {
    const t = $('edTitle'), c = $('edCaption'), h = $('edTags');
    t.value = post.title || '';
    c.value = post.caption || '';
    h.value = (post.hashtags || []).map(x => '#' + x).join(' ');
    const count = () => {
      $('edTitleN').textContent = `${t.value.length} / ${t.maxLength}`;
      $('edCaptionN').textContent = `${c.value.length} / ${c.maxLength}`;
      c.style.height = 'auto';
      c.style.height = Math.max(170, c.scrollHeight + 2) + 'px';
    };
    t.oninput = c.oninput = count;
    const done = v => { $('ed').classList.remove('on'); resolve(v); };
    $('edCancel').onclick = () => done(null);
    $('edSave').onclick = () => {
      if (!t.value.trim() || !c.value.trim()) { alert('A post needs a title and a caption.'); return; }
      done({ title: t.value.trim(), caption: c.value.trim(), tags: h.value.trim() });
    };
    $('ed').classList.add('on');
    count();
    c.focus();
  });
}

async function clipCard(kind, id, platform){
  if (clipBusy) return;
  const k = ((CLIP && CLIP.clips) || []).find(c => String(c.id) === String(id));
  if (kind === 'copytiktok') { if (k && k.post) copyText(k.post.tiktok); return; }
  let body = null;
  if (kind === 'approve') {
    const where = ((CLIP && CLIP.platforms) || []).join(' and ');
    if (!confirm(`Approve and post this clip to ${where}? It goes out with the title, caption and tags shown.`)) return;
  } else if (kind === 'reject') {
    const why = window.prompt('Why not? Clip learns from the reason.', '');
    if (!why || !why.trim()) return;
    body = { why: why.trim() };
  } else if (kind === 'edit') {
    // A real editor, not three one-line prompts: on an iPad those showed a
    // sliver of the caption and could not be read back (owner, 2026-10-09).
    if (!k || !k.post) return;
    body = await editPost(k.post);
    if (!body) return;
  } else if (kind === 'posted') {
    if (!confirm('Mark this clip as posted on TikTok? It will not be offered again.')) return;
  }
  clipBusy = true;
  document.querySelectorAll('#clipClips button').forEach(b => b.disabled = true);
  const url = kind === 'posted' ? `/api/clip/posted/${encodeURIComponent(id)}/${encodeURIComponent(platform)}`
            : `/api/clip/${kind}/${encodeURIComponent(id)}`;
  try { await clipPost(url, body); }
  catch (e) { alert('Could not reach the API: ' + e.message); }
  finally { clipBusy = false; loadClip(); }
}

async function clipAct(kind, id){
  if (clipBusy) return;
  if (kind === 'remake' && !confirm("Cut Clip's own version of this moment from your permitted footage? "
      + 'Rendering takes a minute or two.')) return;
  clipBusy = true;
  document.querySelectorAll('#clipSpot button').forEach(b => b.disabled = true);
  try {
    const url = kind === 'spot' ? '/api/clip/spot' : `/api/clip/remake/${encodeURIComponent(id)}`;
    const r = await fetch(url, { method: 'POST' });
    const j = await r.json();
    alert((j.message || j.error || (r.ok ? 'Done.' : 'That did not work.')).slice(0, 500));
  } catch (e) {
    alert('Could not reach the API: ' + e.message);
  } finally {
    clipBusy = false;
    loadClip();
  }
}

        <div class="muted">${esc(b.state)}</div></div>
      <div class="stat"><div class="l">AI this month</div>
        <div class="v num">${usd(b.ai_month)}</div>
        <div class="muted">month at most ${usd(b.month_at_most)} with the droplet</div></div>
      <div class="stat"><div class="l">Hard stop</div>
        <div class="v" style="font-size:15px">${esc(b.hard_stop || '—')}</div>
        <div class="muted">set on the OpenRouter key</div></div>
    </div>`;
}

function drawGm(g){
  if (!g || g.status === 'none') {
    return `<div class="muted">The GM has not run yet. It runs each morning after Fury's
      briefing; to run it now: <b>python3 scripts/gm.py run</b></div>`;
  }
  if (g.status === 'unreadable') {
    return `<div class="verdict">The GM's morning could not be read${g.reason ? ' — ' + esc(g.reason) : ''}.</div>`;
  }
  const head = `<div class="muted">${esc(g.day)} · ${esc(g.status)}` +
    (g.cost_usd !== null && g.cost_usd !== undefined ? ` · cost $${Number(g.cost_usd).toFixed(4)}` : '') +
    `</div>`;
  if (g.status !== 'ran') {
    return head + `<div class="verdict">${esc(g.reason || 'no reason recorded')}</div>`;
  }
  const facts = g.facts || [];
  const cards = (g.proposals || []).map(p => {
    const d = p.decision;
    const sent = p.sent;
    const state = !d ? '' : d.verdict === 'approve'
      ? '<span class="pill ok">approved</span>' : '<span class="pill warn">declined</span>';
    const who = p.who.charAt(0).toUpperCase() + p.who.slice(1);
    const job = p.task
      ? `<span class="pill">sends: ${esc(p.task)}${p.idea ? ' #' + esc(p.idea) : ''}</span>`
      : '<span class="pill">your to-do</span>';
    const sentLine = !sent ? '' : sent.status === 'sent'
      ? `<div class="w" style="color:var(--up)">Sent to ${esc(who)}: ${esc(sent.detail)}</div>`
      : `<div class="w" style="color:#f59e0b">Not sent: ${esc(sent.detail)}</div>`;
    const rests = (p.facts || []).map(f => {
      const i = Number(String(f).slice(1)) - 1;
      return `<div class="w">${esc(f)}: ${esc(facts[i] || '?')}</div>`;
    }).join('');
    // Once sent, it is on its way: the page offers nothing that pretends to
    // call it back. A send that did not go through can be approved again.
    const approveLabel = p.task
      ? (sent && sent.status !== 'sent' ? `Try sending to ${esc(who)} again` : `Approve & send to ${esc(who)}`)
      : 'Approve (my to-do)';
    const btns = sent && sent.status === 'sent' ? '' : `<div class="acts">
        <button class="yes" data-gm="${p.n}" data-day="${esc(g.day)}" data-verb="approve"
                data-task="${p.task ? 1 : ''}">${approveLabel}</button>
        <button class="no" data-gm="${p.n}" data-day="${esc(g.day)}" data-verb="decline">Decline</button></div>`;
    return `<div class="idea">
      <div class="t">${p.n}. ${esc(p.title)}</div>
      <div class="ktags"><span class="pill">${esc(p.dept)}</span><span class="pill">${esc(p.who)}</span>${job}${state}</div>
      <div class="d"><b>Do:</b> ${esc(p.action)}</div>
      <div class="d"><b>Why:</b> ${esc(p.why)}</div>
      ${rests}
      ${d && d.note ? `<div class="w">your note: ${esc(d.note)}</div>` : ''}
      ${sentLine}
      ${btns}
    </div>`;
  }).join('');
  const dropped = (g.dropped || []).length
    ? `<div class="muted" style="margin-top:8px">Dropped by the checks:</div>` +
      g.dropped.map(x => `<div class="muted">${esc(x.title)} — ${esc(x.reason)}</div>`).join('')
    : '';
  const know = (g.knowledge || []).length
    ? `<div class="muted" style="margin-top:8px">Knowledge it suggested (see Proposed below):</div>` +
      g.knowledge.map(x => `<div class="muted">${esc(x.title)} — ${esc(x.result)}</div>`).join('')
    : '';
  return head + (g.summary ? `<div class="quote">${esc(g.summary)}</div>` : '') +
    (cards || '<div class="muted">No proposals this morning.</div>') + dropped + know;
}

async function actOnProposal(day, n, verdict, sends){
  if (hallBusy) return;
  const ask = verdict === 'decline'
    ? 'Why not? The GM reads this tomorrow so it does not propose it again.'
    : sends
    ? 'This sends the job now. Note for the GM (optional):'
    : 'This one is yours to do. Note for the GM (optional):';
  const note = window.prompt(ask, '');
  if (note === null) return;
  if (verdict === 'decline' && !note.trim()) return;
  hallBusy = true;
  document.querySelectorAll('#hallGm .acts button').forEach(b => b.disabled = true);
  // A build draws its artwork before Emily is queued - up to a couple of
  // minutes - so say so rather than look frozen.
  if (sends && verdict === 'approve') {
    const card = document.querySelector(`#hallGm [data-gm="${n}"]`);
    if (card) card.textContent = 'Sending…';
  }
  try {
    const r = await fetch(`/api/gm/${encodeURIComponent(day)}/${encodeURIComponent(n)}/${verdict}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ note: note.trim() }),
    });
    const j = await r.json();
    if (!r.ok || j.ok === false) alert((j.error || 'That did not work').slice(0, 300));
    else if (sends && verdict === 'approve') alert((j.message || '').slice(0, 400));
  } catch (e) {
    alert('Could not reach the API: ' + e.message);
  } finally {
    hallBusy = false;
    loadHall();
  }
}

function drawHall(){
  if (openAgent !== HALL_DOOR) return;
  if (!HALL) {
    $('hallBudget').innerHTML = '';
    $('hallGm').innerHTML = '';
    $('hallBody').innerHTML = '<div class="verdict">Cannot reach /api/townhall.</div>';
    return;
  }
  $('hallBudget').innerHTML = drawBudget(HALL.budget);
  $('hallGm').innerHTML = drawGm(HALL.gm);

  const k = HALL.knowledge || {};
  const all = k.entries || [];
  const due = new Set(k.due || []);
  const counts = { proposed: 0, accepted: 0, retired: 0 };
  all.forEach(e => { counts[e.status] = (counts[e.status] || 0) + 1; });
  $('hallTabs').innerHTML = ['proposed', 'accepted', 'retired'].map(t =>
    `<button class="ptab${t === hallTab ? ' on' : ''}" data-tab="${t}">${t}
       <span class="ptn">${counts[t] || 0}</span></button>`).join('');

  if (k.error) {
    $('hallBody').innerHTML = `<div class="verdict">${esc(k.error)}</div>`;
    return;
  }
  const rows = all.filter(e => e.status === hallTab);
  if (!rows.length) {
    const hint = hallTab === 'proposed'
      ? 'Nothing waiting. The starting entries go in with <b>python3 scripts/knowledge.py seed</b>.'
      : 'None yet.';
    $('hallBody').innerHTML = `<div class="muted">${hint}</div>`;
    return;
  }
  $('hallBody').innerHTML = rows.map(e => {
    const late = due.has(e.id);
    const acts = e.status === 'proposed'
      ? `<button class="yes" data-k="${e.id}" data-verb="accept">Accept</button>
         <button class="no" data-k="${e.id}" data-verb="retire">Retire</button>`
      : e.status === 'accepted'
      ? `<button class="yes" data-k="${e.id}" data-verb="renew">Still true</button>
         <button class="no" data-k="${e.id}" data-verb="retire">Retire</button>`
      : '';
    return `<div class="idea">
      <div class="t">#${e.id} ${esc(e.title)}</div>
      <div class="ktags">
        <span class="pill">${esc(e.dept)}</span><span class="pill">${esc(e.kind)}</span>
        <span class="pill${e.confidence === 'measured' ? ' ok' : ''}">${esc(e.confidence)}</span>
        <span class="pill">from ${esc(e.source)}</span>
        ${late ? '<span class="pill warn">past review</span>' : ''}
      </div>
      <div class="d">${esc(e.body)}</div>
      ${e.evidence ? `<div class="w">evidence: ${esc(e.evidence)}</div>` : ''}
      ${e.why_retired ? `<div class="w">retired: ${esc(e.why_retired)}</div>` : ''}
      ${acts ? `<div class="acts">${acts}</div>` : ''}
    </div>`;
  }).join('');
}

async function actOnKnowledge(id, verb){
  if (hallBusy) return;
  const body = {};
  if (verb === 'retire') {
    body.why = (window.prompt('Why retire it? Kept with the entry so nobody re-learns it.') || '').trim();
    if (!body.why) return;
  }
  hallBusy = true;
  document.querySelectorAll('#hallBody .acts button').forEach(b => b.disabled = true);
  try {
    const r = await fetch(`/api/knowledge/${encodeURIComponent(id)}/${verb}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok || j.ok === false) alert((j.error || 'That did not work').slice(0, 300));
  } catch (e) {
    alert('Could not reach the API: ' + e.message);
  } finally {
    hallBusy = false;
    loadHall();
  }
}

function closePanel() { closeLb(); closeMarkets(); openAgent = null; $('panel').style.display = 'none'; }

/* Belfort's house: the Markets page in a frame over the village. Removed on
 * close, not hidden, so it stops polling. Escape inside it, or its close
 * button, posts 'markets-close' here. */
function openMarkets() {
  closeMarkets();
  openAgent = 'belfort';
  const f = document.createElement('iframe');
  f.id = 'marketsFrame';
  f.src = '/markets?embed=1';
  f.title = 'Markets';
  f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:60;background:rgba(5,7,12,.92)';
  document.body.appendChild(f);
  f.addEventListener('load', () => { try { f.contentWindow.focus(); } catch (e) {} });
}
function closeMarkets() {
  const f = $('marketsFrame');
  if (f) { f.remove(); if (openAgent === 'belfort') openAgent = null; }
}
window.addEventListener('message', e => {
  if (e.origin === location.origin && e.data && e.data.type === 'markets-close') closeMarkets();
});
$('panel').addEventListener('click', e => { if (e.target.id === 'panel') closePanel(); });

/* ---------------- touch ---------------- */

function isTouch() { return window.matchMedia('(pointer: coarse)').matches; }

(function stick() {
  const el = $('stick'), nub = $('nub');
  const R = 46;
  const set = (dx, dy) => { nub.style.transform = `translate(${dx}px,${dy}px)`; };
  const start = e => {
    const t = e.changedTouches ? e.changedTouches[0] : e;
    touch.active = true; touch.id = t.identifier ?? 'mouse';
    move(e); e.preventDefault();
  };
  const move = e => {
    if (!touch.active) return;
    const t = e.changedTouches ? [...e.changedTouches].find(x => x.identifier === touch.id) : e;
    if (!t) return;
    const r = el.getBoundingClientRect();
    let dx = t.clientX - (r.left + r.width/2), dy = t.clientY - (r.top + r.height/2);
    const d = Math.hypot(dx, dy);
    if (d > R) { dx = dx/d*R; dy = dy/d*R; }
    set(dx, dy);
    touch.dx = dx / R; touch.dy = dy / R;
    e.preventDefault();
  };
  const end = e => { touch.active = false; touch.dx = touch.dy = 0; set(0,0); };
  el.addEventListener('touchstart', start, {passive:false});
  el.addEventListener('touchmove', move, {passive:false});
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
  el.addEventListener('mousedown', start);
  window.addEventListener('mousemove', e => touch.active && move(e));
  window.addEventListener('mouseup', end);
})();

$('act').addEventListener('click', () => { if (nearDoor) openPanel(nearDoor.name); });

/* ---------------- data ---------------- */

async function pull(first) {
  try {
    const r = await fetch('/api/dashboard', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const next = await r.json();
    const changed = first || (next.agents || []).length !== (DATA.agents || []).length;
    DATA = next;
    $('chip').textContent = `${DATA.agents.length} agent${DATA.agents.length===1?'':'s'} · ${DATA.health.status}`;
    if (first) boot();
    else if (changed && scene) scene.scene.restart();   // a new agent gets a house
    // NO PANEL IS REDRAWN HERE. The pull keeps the village itself current -
    // lamps, the notice board, a new agent's house - and an open panel shows
    // what was true when it was opened. Redrawing every six seconds wiped the
    // Props Hall's search box mid-word, and in the houses it re-fetched the
    // gallery and ideas, jumped the scroll and could redraw under a finger
    // about to press Approve. The owner asked for every house to behave like
    // the Props Hall (2026-09-25): close and reopen for fresh numbers. A
    // panel's own buttons reload what they changed.
  } catch (e) {
    $('chip').textContent = 'offline';
    if (first) $('boot').textContent = 'Cannot reach /api/dashboard — is mission-control-api running?';
  }
}

function boot() {
  new Phaser.Game({
    type: Phaser.AUTO, parent: 'game',
    backgroundColor: '#5a9e4b',
    pixelArt: true, roundPixels: true,
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
    scene: { preload, create, update },
  });
  window.addEventListener('resize', () => {
    if (scene) scene.cameras.main.setZoom(zoomForViewport());
  });
}

pull(true);
setInterval(() => pull(false), 6000);
</script>
