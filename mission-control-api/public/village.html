<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- Added to the home screen from Safari this opens without browser chrome. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel Village">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pixel Village</title>
<style>
  :root{ --ink:#e8ecf5; --mute:#9aa4bb; --card:#141824; --line:rgba(255,255,255,.10);
         --up:#34d399; --down:#fb7185; --warn:#fbbf24; --c1:#22d3ee; --c2:#a78bfa; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1b2a1f;
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  #game{position:fixed;inset:0}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  .num{font-variant-numeric:tabular-nums}

  /* HUD */
  #hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;gap:10px;
    align-items:center;pointer-events:none;z-index:5;
    background:linear-gradient(180deg,rgba(8,12,10,.72),transparent)}
  #hud .title{font-weight:700;letter-spacing:-.01em;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  #hud .chip{margin-left:auto;font-size:12px;color:var(--mute);background:rgba(0,0,0,.42);
    border:1px solid var(--line);border-radius:999px;padding:4px 10px}

  /* interaction prompt */
  #prompt{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:6;
    background:rgba(10,14,12,.88);border:1px solid var(--line);border-radius:12px;
    padding:9px 16px;font-size:13px;display:none;pointer-events:none;
    box-shadow:0 8px 26px rgba(0,0,0,.45)}
  #prompt b{color:var(--c1)}

  /* touch controls */
  #stick{position:fixed;left:20px;bottom:22px;width:132px;height:132px;z-index:7;
    border-radius:50%;background:rgba(0,0,0,.26);border:1px solid var(--line);touch-action:none;display:none}
  #nub{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
    border-radius:50%;background:rgba(255,255,255,.30);border:1px solid rgba(255,255,255,.4)}
  #act{position:fixed;right:22px;bottom:38px;width:88px;height:88px;z-index:7;border-radius:50%;
    background:linear-gradient(135deg,var(--c1),var(--c2));border:0;color:#06121a;font-weight:800;
    font-size:15px;display:none;box-shadow:0 8px 26px rgba(0,0,0,.5)}
  #act:active{transform:scale(.94)}

  /* agent panel */
  #panel{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(4,7,10,.72);backdrop-filter:blur(6px);padding:18px}
  #card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    width:min(560px,100%);max-height:86vh;overflow:auto;padding:20px;
    box-shadow:0 24px 70px rgba(0,0,0,.6)}
  #card.wide{width:min(780px,100%)}
  #card h2{margin:0 0 2px;font-size:21px;text-transform:capitalize;letter-spacing:-.01em}
  #card .sub{color:var(--mute);font-size:12.5px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:11px;padding:11px}
  .stat .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
  .stat .v{font-size:20px;font-weight:650;margin-top:3px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--mute)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:right;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);
     padding-bottom:7px;border-bottom:1px solid var(--line);font-weight:600}
  th:first-child,td:first-child{text-align:left}
  td{padding:8px 0;border-bottom:1px solid var(--line);text-align:right}
  tr:last-child td{border-bottom:0}
  .quote{background:rgba(255,255,255,.035);border-left:2px solid var(--c2);border-radius:0 9px 9px 0;
    padding:10px 12px;font-size:12.5px;color:var(--mute);line-height:1.5;margin-top:6px}
  #close{margin-top:16px;width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:var(--ink);font-size:14px;font-weight:600}
  .muted{color:var(--mute);font-size:12.5px}
  .idea{padding:11px 0;border-bottom:1px solid var(--line)}
  .idea:last-of-type{border-bottom:0}
  .idea .t{font-weight:600}
  .idea .p{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);
    border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:7px;vertical-align:1px}
  .idea .d{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.45}
  .idea .w{font-size:11.5px;color:#7c869c;margin-top:4px;font-style:italic;line-height:1.45}
  .acts{display:flex;gap:8px;margin-top:9px}
  .acts button{flex:1;padding:9px;border-radius:10px;font-size:12.5px;font-weight:600;
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink)}
  .acts button:disabled{opacity:.45}
  .acts .yes{border-color:rgba(52,211,153,.45);color:var(--up)}
  .acts .no{border-color:rgba(251,113,133,.40);color:var(--down)}

  /* Emily's gallery */
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:4px}
  .build{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:rgba(255,255,255,.03)}
  .build img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:rgba(255,255,255,.05)}
  .build .noart{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;
    color:var(--mute);font-size:11px;background:rgba(255,255,255,.04)}
  .build .meta{padding:8px 9px 9px}
  .build .bt{font-size:11.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .build .bs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .pill{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;
    padding:2px 5px;border:1px solid var(--line);color:var(--mute)}
  .ktags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .pill.ok{border-color:rgba(52,211,153,.45);color:var(--up)}
  .pill.warn{border-color:rgba(245,158,11,.45);color:#f59e0b}
  #lb{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;padding:18px;background:rgba(3,5,8,.94)}
  #lb.on{display:flex}
  /* The post editor: full width on an iPad, 17px+ text so Safari never zooms,
     the whole caption visible without scrolling inside a one-line box. */
  #ed{position:fixed;inset:0;z-index:30;display:none;align-items:flex-start;justify-content:center;
    background:rgba(5,8,14,.72);padding:4vh 14px;overflow-y:auto}
  #ed.on{display:flex}
  #edbox{width:min(760px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px 20px 16px}
  #edbox h2{margin:0 0 10px;font-size:20px}
  #edbox label{display:block;margin:14px 0 6px;font-size:13px;letter-spacing:.04em;color:var(--mute);
    text-transform:uppercase}
  #edbox .edn{float:right;text-transform:none;letter-spacing:0}
  #edbox input,#edbox textarea{width:100%;box-sizing:border-box;font-family:inherit;font-size:17px;
    line-height:1.45;color:inherit;
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    resize:vertical}
  #edbox textarea#edCaption{min-height:170px}
  #edbox input:focus,#edbox textarea:focus{outline:2px solid rgba(52,211,153,.6);outline-offset:1px}
  .edacts{display:flex;gap:12px;margin-top:18px}
  .edacts button{flex:1;padding:15px;border-radius:12px;font-size:17px;font-weight:600;
    background:transparent;color:inherit;border:1px solid var(--line)}
  .edacts .yes{border-color:rgba(52,211,153,.55);color:var(--up)}
  #lb img{max-width:min(100%,760px);max-height:66vh;border-radius:11px;border:1px solid var(--line);background:#000}
  #lb .bar{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  #lb .bar button{padding:8px 12px;border-radius:10px;font-size:12px;font-weight:600;
    border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink)}
  #lb .bar button.sel{border-color:var(--c2);color:#fff}
  #lb .cap{font-size:12.5px;color:var(--mute);text-align:center}

  /* report reader */
  .doclink{cursor:pointer;color:var(--c2);border-bottom:1px dotted rgba(255,255,255,.3)}
  #doc{position:fixed;inset:0;z-index:26;display:none;align-items:flex-start;justify-content:center;
    background:rgba(4,7,10,.94);padding:16px;overflow:auto}
  #doc.on{display:flex}
  #docbox{background:var(--card);border:1px solid var(--line);border-radius:16px;
    width:min(680px,100%);margin:auto;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  #dochead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--card);border-radius:16px 16px 0 0;flex-wrap:wrap}
  #dochead .who{font-weight:650;text-transform:capitalize}
  #dochead .when{font-size:11.5px;color:var(--mute)}
  #dochead button{margin-left:auto;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:600;
    border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink)}
  #docdays{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
  #docdays button{padding:4px 9px;border-radius:7px;font-size:11px;
    border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mute)}
  #docdays button.sel{border-color:var(--c2);color:#fff}
  #docbody{padding:4px 18px 20px;font-size:13.5px;line-height:1.6}
  #docbody h1{font-size:18px;margin:16px 0 8px}
  #docbody h2{font-size:14px;margin:18px 0 6px;color:var(--c2)}
  #docbody h3{font-size:13px;margin:14px 0 5px;color:var(--mute)}
  #docbody p{margin:8px 0}
  #docbody ul,#docbody ol{margin:8px 0;padding-left:20px}
  #docbody li{margin:4px 0}
  #docbody code{background:rgba(255,255,255,.08);border-radius:4px;padding:1px 5px;font-size:12px}
  #docbody blockquote{margin:10px 0;padding:8px 12px;border-left:2px solid var(--c1);
    background:rgba(255,255,255,.03);border-radius:0 8px 8px 0;color:var(--mute)}
  #docbody hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  #docbody .tw{overflow-x:auto;margin:10px 0}
  #docbody em{color:var(--mute)}

  /* Ace's betting console */
  .verdict{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;
    padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:12px}
  /* Player forecast cards. Shaped after a tool the owner was shown: a label
     that says it is not a bet, the headline probability, the thresholds
     either side of it, and the sample it was built from - so the number is
     never separated from how much it is worth. */
  .fcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));margin-bottom:18px}
  .fcard{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px}
  .fcard.done{opacity:.72}
  .fchead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .fchead>div:first-child{flex:1;min-width:0}
  /* The label is one phrase; wrapping it mid-way reads as two claims. */
  .fclabel{font-size:9px;letter-spacing:.08em;color:#5aa9f0;font-weight:700;white-space:nowrap}
  .fcname{font-size:17px;font-weight:700;margin-top:3px;overflow-wrap:anywhere}
  .fcsub{font-size:12px;color:var(--mute);margin-top:2px}
  .fcbig{font-size:23px;font-weight:700;color:#5aa9f0;text-align:right;line-height:1.1;
    flex:0 0 auto;white-space:nowrap;
    border:1px solid rgba(90,169,240,.35);border-radius:9px;padding:6px 9px;background:rgba(90,169,240,.07)}
  .fcbigl{font-size:10px;color:var(--mute);font-weight:600}
  .fctiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:6px;margin:12px 0 8px}
  .fct{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
  .fct.on{border-color:rgba(90,169,240,.45);background:rgba(90,169,240,.09)}
  .fctl{font-size:10px;color:var(--mute)}
  .fctv{font-size:15px;font-weight:700}
  .fctr{font-size:9px;opacity:.5;letter-spacing:.04em;margin-top:1px}
  /* The drafter's own refusal, under the build it refused. Monospace and
     pre-line: these quote a file path and a parser error, and folding them
     into one line loses where the error was. */
  .bwhy{margin-top:6px;padding:6px 8px;border-radius:6px;font-size:10.5px;
        line-height:1.45;white-space:pre-line;word-break:break-word;
        color:#fbbf24;background:rgba(251,191,36,.08);
        border:1px solid rgba(251,191,36,.22);
        font-family:ui-monospace,Menlo,monospace}
  .ptabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
  .ptab{background:#1b2330;border:1px solid #2c3647;color:#8fa0b8;border-radius:7px;
        padding:6px 10px;font:600 11px ui-monospace,Menlo,monospace;cursor:pointer;
        letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .ptab:hover{border-color:#3d4a60;color:#c7d3e4}
  .ptab.on{background:#26344a;border-color:#4d6a96;color:#e8f0fa}
  .ptn{font-size:10px;opacity:.6;font-weight:400}
  /* The week's games. A search box and a list rather than a dropdown: on a
     tablet a sixteen-item select is a scroll wheel you cannot see into. */
  .gsearch{width:100%;box-sizing:border-box;margin:4px 0 10px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-size:14px}
  .gday{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
    margin:10px 0 6px;font-family:ui-monospace,Menlo,monospace}
  .glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .gbtn{text-align:left;background:#1b2330;border:1px solid #2c3647;color:#c7d3e4;border-radius:9px;
    padding:9px 10px;cursor:pointer;font:600 13px ui-monospace,Menlo,monospace}
  .gbtn:hover{border-color:#3d4a60}
  .gbtn.on{background:#26344a;border-color:#4d6a96;color:#fff}
  .gbtn .gt{display:block;font:400 11px system-ui,sans-serif;color:var(--mute);margin-top:3px}
  .gbtn .gok{color:#7fd19b}
  .grun{margin:12px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:rgba(255,255,255,.03);font-size:12.5px}
  .grun button{margin-left:8px;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;
    border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);cursor:pointer}
  .grun pre{white-space:pre-wrap;font-size:11px;max-height:260px;overflow:auto;color:var(--mute)}
  /* One line per fact, wrapping as a unit - a footer that breaks between
     "10,000" and "DRAWS" reads as two different numbers. */
  .fcfoot{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10px;letter-spacing:.04em;color:var(--mute)}
  .fcfoot span{white-space:nowrap}
  .fcwarn{color:#e8b566;font-weight:700}
  /* A book's line, for reading beside the percentages. Deliberately quiet:
     it is context, and nothing on the card was computed from it. */
  .fcline{color:#9fb4d0}
  .fcres{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;font-weight:600}
  .fcres.pend{color:var(--mute);font-weight:400}
  .verdict b{color:var(--ink)}
  .sect{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
    margin:18px 0 8px;font-family:ui-monospace,Menlo,monospace}
  .board{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
  .board table{min-width:560px;font-size:12px}
  .board th{white-space:nowrap;font-size:9.5px;padding:0 8px 6px 0;text-align:left}
  .board td{padding:8px 8px 8px 0;vertical-align:top;text-align:left;border-bottom:1px solid var(--line)}
  .board .sel{font-weight:600;white-space:nowrap}
  .board .mt{color:var(--mute);font-size:11px}
  .board .why{color:#c9a227;font-size:11px;line-height:1.4;min-width:150px}
  .board .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tagp{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;border-radius:5px;
    padding:2px 6px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
  .tagp.bet{border-color:rgba(52,211,153,.5);color:var(--up)}
  .tagp.won{border-color:rgba(52,211,153,.5);color:var(--up)}
  .tagp.lost{border-color:rgba(251,113,133,.45);color:var(--down)}
  .mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mini .box{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:10px}
  .mini .box .l{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
  .mini .box .rowline{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;margin-top:5px}
  .mini .box .rowline span:last-child{color:var(--mute);font-variant-numeric:tabular-nums}

  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;
    background:#121a14;color:var(--mute);font-size:13px;text-align:center;padding:24px}

  /* ---- Scout's verdict deck ----------------------------------------
     A dense list you scan, not a form you read. The point is that a
     verdict takes one glance: the numbers are already on the row, and
     opening one shows where they came from rather than more adjectives. */
  .vdeck{--amber:#f0b429;--glow:rgba(240,180,41,.55)}
  .vtally{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .vt{flex:1;min-width:84px;border:1px solid var(--line);border-radius:9px;
      padding:8px 10px;background:rgba(255,255,255,.02)}
  .vt b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
  .vt span{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
  .vt.lead{border-color:rgba(240,180,41,.5);box-shadow:0 0 0 1px rgba(240,180,41,.12) inset}
  .vt.lead b{color:var(--amber)}
  .vrow{border:1px solid var(--line);border-left:3px solid rgba(240,180,41,.55);
        border-radius:8px;margin-bottom:7px;background:rgba(255,255,255,.015);
        cursor:pointer;transition:border-color .12s,background .12s}
  .vrow:hover{background:rgba(240,180,41,.05)}
  .vrow.open{border-color:rgba(240,180,41,.45);background:rgba(240,180,41,.045)}
  .vhead{display:flex;align-items:center;gap:9px;padding:9px 11px}
  .vtag{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;
        border:1px solid rgba(240,180,41,.5);border-radius:4px;color:var(--amber);
        white-space:nowrap}
  .vslug{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vnum{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
  .vbody{padding:0 11px 11px}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;
         margin-bottom:10px}
  .vcell{border:1px solid var(--line);border-radius:7px;padding:8px 9px;
         background:rgba(255,255,255,.02)}
  .vcell h4{margin:0 0 3px;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
            color:var(--mute);font-weight:600}
  .vcell .big{font-size:15px;font-variant-numeric:tabular-nums;line-height:1.25}
  .vcell .sm{font-size:11px;color:var(--mute);margin-top:3px;line-height:1.4}
  .vcell.none{border-style:dashed}
  .vcell.none .big{color:var(--down);font-size:12.5px}
  .vfoot{font-size:10px;color:var(--mute);letter-spacing:.03em;margin-top:10px;
         padding-top:8px;border-top:1px solid var(--line);line-height:1.5}

<script>
/* ------------------------------------------------------------------ *
 * Pixel Village — a walkable front-end for the agent ecosystem.
 * Every texture here is generated in code. No image files, no asset
 * packs, nothing to buy. Swap in a real tileset later if you want.
 * ------------------------------------------------------------------ */

const T = 32;                 // tile size
const MAP_W = 38, MAP_H = 23; // tiles

// Hand-placed house plots rather than `col = i % 5`. A grid puts every house on
// the same baseline at the same spacing, which reads as a row of identical
// buildings - the one thing a neighbourhood never looks like. These sit at
// different depths, in loose clusters, some set back from the lane and some
// close to it. `flip` mirrors a house so its neighbour is not a photocopy.
// `side` is for a plot south of the lane, whose door faces away from it: the
// side its garden path comes down before turning along the front.
// Module scope because the ground painter needs them too, to run a garden path
// from each door out to the lane before anything is drawn.
const PLOTS = [
  { x: 2.5,  y: 4.5,  flip: false },
  { x: 8.6,  y: 7.6,  flip: true  },
  { x: 13.8, y: 3.2,  flip: false },
  { x: 23.6, y: 6.2,  flip: true  },
  { x: 29.8, y: 2.6,  flip: false },
  { x: 26.4, y: 17.6, flip: true,  side: 'left'  },
  { x: 11.6, y: 18.6, flip: false, side: 'right' },
  { x: 33.4, y: 8.6,  flip: true  },
];

// Agents that live in the Deck but have no house. Fury's whole cycle is
// Python and it never needs visiting; its card stays in the Deck. One list,
// used by the house loop and the garden paths both, so a path never leads
// to a house that is not there.
const NO_HOUSE = new Set(['fury']);
const housed = () => (DATA.agents || []).filter(a => !NO_HOUSE.has(a.name));

// Houses drawn for one agent's trade (makeTextures, "themed houses"): the
// thing in each garden, the building's height (they share a 128px frontage
// and a door; a Wall Street tower just rises further), and where its status
// lamp sits - the tower's spire tip, the arena's jumbotron. Anyone else gets
// a plain house and a plain villager.
const THEMED = {
  belfort: { prop: 'bull',  h: 240, lamp: [64, 3] },
  ace:     { prop: 'hoop',  h: 132, lamp: [100, 30] },
  emily:   { prop: 'easel', h: 144, lamp: [52, 9] },
  scout:   { prop: 'globe', h: 172, lamp: [64, 5] },
  paul:    { prop: 'drafting', h: 168, lamp: [101, 3] },
};

// What each resident wears, so the person outside a house fits it. A base
// (jacket, trousers, hair, skin) and `more`, drawn over the top for the
// details - a tie, a number, a beret. Each gets its own walk textures
// (`npc-<name>-<facing>-<frame>`) and animations; nobody listed here is a
// plain villager tinted a shirt colour. g, facing, frame, leg x positions.
const OUTFITS = {
  belfort: { shirt: 0x1f2a44, back: 0x1a2438, legs: 0x1a2030, hair: 0x1f160e, shoes: 0x0b0d12,
    more: (g, f) => {                                        // a navy suit, red tie, briefcase
      if (f === 'down') {
        px(g, 10, 11, 4, 2, 0xffffff); px(g, 11, 12, 2, 7, 0xc0392b); px(g, 11, 11, 2, 1, 0x8e2a20);
        px(g, 9, 11, 1, 6, 0x33426a); px(g, 14, 11, 1, 6, 0x33426a); px(g, 15, 13, 2, 1, 0xffffff);
        px(g, 18, 17, 5, 5, 0x5a3d1c); px(g, 19, 16, 3, 1, 0x3a2a14);
      } else if (f === 'side') {
        px(g, 13, 11, 2, 2, 0xffffff); px(g, 14, 12, 1, 6, 0xc0392b);
        px(g, 15, 17, 6, 5, 0x5a3d1c); px(g, 17, 16, 2, 1, 0x3a2a14);
      }
      px(g, 8, 2, 6, 1, 0x4a3a2a);                            // slicked, parted
    } },
  ace: { shirt: 0xf28c28, back: 0xe07a1f, legs: 0x1f3a68, hair: 0x2a1a10, shoes: 0xffffff, skin: 0xc9905e,
    more: (g, f, fr, L) => {                                 // a jersey, #23, headband, sneakers
      px(g, 6, 11, 12, 1, 0x1f3a68); px(g, 6, 11, 1, 10, 0x1f3a68); px(g, 17, 11, 1, 10, 0x1f3a68);
      if (f !== 'side') { px(g, 4, 12, 2, 6, 0xc9905e); px(g, 18, 12, 2, 6, 0xc9905e); }
      else px(g, 10, 12, 3, 6, 0xc9905e);
      if (f !== 'side') {                                     // 2 and 3, 3x5 each
        [[0, 0, 3], [2, 1, 1], [0, 2, 3], [0, 3, 1], [0, 4, 3]].forEach(([x, y, w]) => px(g, 8 + x, 13 + y, w, 1, 0xffffff));
        [[0, 0, 3], [2, 1, 1], [1, 2, 2], [2, 3, 1], [0, 4, 3]].forEach(([x, y, w]) => px(g, 13 + x, 13 + y, w, 1, 0xffffff));
      }
      L.forEach(x => px(g, x, 23, 4, 2, 0xc9905e));           // shorts, then legs
      px(g, 7, 5, 10, 1, 0xffffff);                           // headband
    } },
  emily: { shirt: 0xe9dcf5, back: 0xdccbee, legs: 0x3b5b92, hair: 0x8a4b2a,
    more: (g, f) => {                                        // beret, smock with paint on it, long hair
      if (f === 'down') { px(g, 6, 5, 2, 9, 0x8a4b2a); px(g, 16, 5, 2, 9, 0x8a4b2a); }
      else if (f === 'up') px(g, 7, 4, 10, 10, 0x8a4b2a);
      else px(g, 8, 5, 3, 9, 0x8a4b2a);
      px(g, 6, 1, 12, 3, 0xb5304a); px(g, 7, 1, 5, 1, 0xd4506a); px(g, 11, 0, 2, 1, 0xb5304a);
      px(g, 8, 14, 2, 2, 0xff5d8f); px(g, 13, 16, 2, 2, 0x2ec4b6); px(g, 10, 18, 2, 1, 0xffd23f);
      if (f === 'down') { px(g, 18, 14, 1, 6, 0xb07a3a); px(g, 18, 12, 1, 2, 0xff5d8f); }
    } },
  scout: { shirt: 0x5f7a45, back: 0xb89d68, legs: 0x7d6b45, hair: 0x5a3d22, shoes: 0x5a3d1c,
    more: (g, f) => {                                        // explorer: hat, glasses, vest, notebook
      px(g, 5, 3, 14, 2, 0xc8a86b); px(g, 8, 0, 8, 4, 0xb8965a); px(g, 8, 3, 8, 1, 0x6b4a2e);
      if (f === 'down') {
        px(g, 8, 7, 3, 3, 0x2b2f3a); px(g, 13, 7, 3, 3, 0x2b2f3a); px(g, 11, 8, 2, 1, 0x2b2f3a);
        px(g, 9, 8, 1, 1, 0xaee3ff); px(g, 14, 8, 1, 1, 0xaee3ff);
        px(g, 6, 11, 3, 10, 0xb89d68); px(g, 15, 11, 3, 10, 0xb89d68);
        px(g, 7, 15, 2, 2, 0x8a7448); px(g, 15, 15, 2, 2, 0x8a7448);
        px(g, 18, 15, 3, 4, 0xf2e6c9); px(g, 18, 15, 3, 1, 0xb5504c);
      } else if (f === 'side') {
        px(g, 11, 7, 3, 3, 0x2b2f3a); px(g, 12, 8, 1, 1, 0xaee3ff); px(g, 12, 11, 4, 10, 0xb89d68);
      }
    } },
  paul: { shirt: 0x17191f, back: 0x15171c, legs: 0x4a5160, hair: 0x6b7280, shoes: 0x0b0d12,
    more: (g, f) => {                                        // the architect: black turtleneck, big
      const K = 0x0b0d12, BLUE = 0x2f6fb5, END = 0xe8f1fb;   // browline glasses, a roll of blueprints
      px(g, 8, 11, 8, 2, 0x2a2e38);                          // the roll neck
      px(g, 12, 1, 5, 2, 0xb8bec7); px(g, 15, 3, 2, 1, 0xb8bec7);   // salt and pepper, swept up
      const lens = x => { px(g, x, 7, 4, 1, K); px(g, x, 8, 1, 2, K); px(g, x + 3, 8, 1, 1, K); };
      if (f === 'down') {
        lens(8); lens(12);
        px(g, 15, 13, 8, 3, BLUE); px(g, 15, 13, 8, 1, 0x5b95d6);    // the roll, under his arm
        px(g, 15, 13, 1, 3, END); px(g, 22, 13, 1, 3, END); px(g, 18, 14, 2, 1, END, .6);
      } else if (f === 'side') {
        lens(11); px(g, 8, 7, 3, 1, K);                          // a lens and the arm to his ear
        px(g, 6, 14, 12, 3, BLUE); px(g, 6, 14, 12, 1, 0x5b95d6);
        px(g, 6, 14, 1, 3, END); px(g, 17, 14, 1, 3, END);
      } else {
        px(g, 15, 9, 3, 12, BLUE); px(g, 15, 9, 3, 1, END); px(g, 15, 20, 3, 1, END);   // slung on his back
      }
    } },
  clip: { shirt: 0x22252e, back: 0x22252e, legs: 0x4b5563, hair: 0x3a2a1d,
    more: (g, f) => {                                        // hoodie in the app colours, cap on backwards
      px(g, 6, 15, 12, 1, 0xff3d7f); px(g, 6, 16, 12, 1, 0x23d5e6);
      if (f === 'down') { px(g, 10, 12, 1, 3, 0xe5e7eb); px(g, 13, 12, 1, 3, 0xe5e7eb); }
      px(g, 7, 1, 10, 4, 0x23d5e6);
      if (f === 'up') px(g, 8, 5, 8, 2, 0x1aa9b8); else if (f === 'side') px(g, 4, 3, 4, 2, 0x1aa9b8);
    } },
  spotter: { shirt: 0x2c8f8a, back: 0x257a76, legs: 0x3f4753, hair: 0x6b4a2e,
    more: (g, f) => {                                        // binoculars round the neck
      if (f !== 'up') { px(g, 9, 11, 1, 3, 0x1b1e24); px(g, 14, 11, 1, 3, 0x1b1e24);
                        px(g, 9, 14, 3, 3, 0x1b1e24); px(g, 12, 14, 3, 3, 0x1b1e24); px(g, 10, 15, 1, 1, 0x7fd3ff); }
    } },
};
const look = name => OUTFITS[name] ? `npc-${name}` : 'hero';
const walkAnim = (lk, f) => lk === 'hero' ? `walk-${f}` : `${lk}-walk-${f}`;

// The town square's statue; its plinth is the Town Hall's door. The base
// line, in tiles - the statue stands 196px up from it.
const STATUE = { x: 19, y: 17.2 };

// The props hall stands apart from the houses on purpose: the forecasts are
// not Ace's work and were never his to keep - he places bets off odds and
// this thing holds no odds at all. Its own plot, kept out of PLOTS so an
// agent added later cannot be given the same ground.
const PROPS_PLOT = { x: 31.0, y: 15.6 };
const PROPS_DOOR = 'Player Props';

// The town square's notice board doubles as the Town Hall: the month's budget
// and the knowledge the owner accepts. A door with no agent behind it, like
// the props hall.
const HALL_DOOR = 'Town Hall';

// The name over a villager's head - every resident wears one, so nobody
// outside a house is just "someone" (owner, 2026-10-07). One style for all.
// How far below a door a resident may walk: the name plate hangs to 25px
// under it and a tag stands 26px over the feet, so above this line the tag
// would sit on the plate ("EMILY Emily").
const TAG_CLEAR = 52;
function nameTag(sc, x, y, who) {
  return sc.add.text(x, y, who, {
    fontFamily: 'ui-monospace,Menlo,monospace', fontSize: '9px', color: '#ffffff',
    backgroundColor: '#00000088', padding: { x: 3, y: 1 },
  }).setOrigin(.5, 1);
}

// Clip's studio: the clipping agent and Spotter, its research assistant. Its
// own plot, like the props hall, kept out of PLOTS so the next agent cannot
// be given the same ground - and 4.5 tiles wide rather than 5, so it clears
// the gardens of the houses either side of it.
const CLIP_PLOT = { x: 18.7, y: 4.2 };
const CLIP_DOOR = 'Clip';

// The pond, one x-span per row. A rectangle of water in a field looks like a
// swimming pool; the point of listing rows is that the edge can wander.
const POND = { 16: [4, 7], 17: [3, 8], 18: [2, 9], 19: [1, 9], 20: [1, 8], 21: [2, 7], 22: [3, 6] };
const W = MAP_W * T, H = MAP_H * T;

let DATA = { agents: [], kpis: {}, health: {} };
let scene = null, player = null, doors = [], nearDoor = null, openAgent = null;
let npcs = [], boardText = null, boardSub = null;
const keys = {};
const touch = { active: false, dx: 0, dy: 0, id: null };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => (v === null || v === undefined) ? '—'
  : (v < 0 ? '-' : '') + '$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const pctTxt = v => (v === null || v === undefined) ? '' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
const cls = v => (v === null || v === undefined) ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const ago = m => (m === null || m === undefined) ? 'never' : m < 1 ? 'just now'
  : m < 60 ? m + 'm ago' : m < 1440 ? Math.floor(m/60) + 'h ago' : Math.floor(m/1440) + 'd ago';

/* ---------------- procedural pixel art ----------------
 * Still no image files and nothing to buy. What changed is how much work
 * the generator does: flat fills became tonal bands, hard tile seams became
 * irregular fringes, and everything that sits on the ground now casts a
 * shadow. The old version drew one colour per surface, which is what made it
 * read as a diagram rather than a place.
 * ----------------------------------------------------------------------- */

function px(g, x, y, w, h, color, alpha) { g.fillStyle(color, alpha === undefined ? 1 : alpha); g.fillRect(x, y, w, h); }

// Deterministic noise, so the village looks the same on every reload. A
// village that reshuffles its grass every refresh feels broken.
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}

// Scatter n single pixels of `color` across a w×h area.
function speckle(g, r, w, h, color, n, size) {
  for (let i = 0; i < n; i++) {
    const sz = size || 1;
    px(g, Math.floor(r() * (w - sz)), Math.floor(r() * (h - sz)), sz, sz, color);
  }
}

const PAL = {
  grass:  [0x4c8a3a, 0x5c9c44, 0x6db052, 0x84c765],
  path:   [0xbe9c66, 0xd0ac75, 0xdcbd8b, 0xe9d2a8],
  water:  [0x2b6396, 0x3a7fb8, 0x53a0d6, 0x9ad6ef],
  wood:   [0x5f4026, 0x7d5533, 0x9b6f45, 0xbc8d5e],
  stone:  [0x6f7480, 0x898f9b, 0xa6acb8, 0xc6ccd6],
  leaf:   [0x24632f, 0x2f7d3d, 0x3f9b50, 0x5fbd6e],
};

function makeTextures(s) {
  let g;

  /* --- ground: four grass variants so no seam repeats next to itself --- */
  for (let v = 0; v < 4; v++) {
    const r = rng(9001 + v * 77);
    g = s.add.graphics();
    px(g, 0, 0, T, T, PAL.grass[1]);
    // broad tonal patches first, then blades on top. One flat green was the
    // single biggest reason the old ground looked like graph paper.
    for (let i = 0; i < 5; i++) {
      const w = 6 + Math.floor(r() * 12), h = 4 + Math.floor(r() * 8);
      px(g, Math.floor(r() * (T - w)), Math.floor(r() * (T - h)), w, h, PAL.grass[r() < .5 ? 0 : 2], .5);
    }
    for (let i = 0; i < 14; i++) {
      const x = Math.floor(r() * T), y = Math.floor(r() * (T - 3));
      px(g, x, y, 1, 2 + Math.floor(r() * 2), PAL.grass[3], .75);
    }
    speckle(g, r, T, T, PAL.grass[0], 10);
    g.generateTexture(`grass${v}`, T, T); g.destroy();
  }

  /* --- dirt path, four variants with gravel --- */
  for (let v = 0; v < 4; v++) {
    const r = rng(4400 + v * 31);
    g = s.add.graphics();
    px(g, 0, 0, T, T, PAL.path[1]);
    for (let i = 0; i < 4; i++) {
      const w = 8 + Math.floor(r() * 14), h = 5 + Math.floor(r() * 9);
      px(g, Math.floor(r() * (T - w)), Math.floor(r() * (T - h)), w, h, PAL.path[r() < .5 ? 0 : 2], .45);
    }
    speckle(g, r, T, T, PAL.path[3], 12);
    speckle(g, r, T, T, PAL.path[0], 14);
    for (let i = 0; i < 3; i++) px(g, Math.floor(r()*(T-3)), Math.floor(r()*(T-2)), 2 + Math.floor(r()*2), 2, PAL.stone[1], .6);
    g.generateTexture(`path${v}`, T, T); g.destroy();
  }

  /* --- cobbled plaza. The square was the same dirt as the lanes, so the
   * middle of the village read as a wide road rather than a place. --- */
  for (let v = 0; v < 3; v++) {
    const r = rng(5200 + v * 37);
    g = s.add.graphics();
    // Warm sandstone, not grey. The first attempt used cold greys at 8px and
    // the square read as a concrete slab dropped into a field.
    px(g, 0, 0, T, T, 0x9c8a6d);
    for (let row = 0; row < 6; row++) {
      const off = row % 2 ? 3 : 0;
      for (let col = -1; col < 7; col++) {
        const cx2 = col * 6 + off, cy = row * 6;
        const tone = [0xc4ae86, 0xb8a179, 0xcdb891, 0xad9770][Math.floor(r() * 4)];
        px(g, cx2 + 1, cy + 1, 4, 4, tone);
        px(g, cx2 + 1, cy + 1, 4, 1, 0xdcc9a6, .45);
        px(g, cx2 + 1, cy + 4, 4, 1, 0x7d6c52, .3);
      }
    }
    speckle(g, r, T, T, 0x8a7a5e, 10);
    speckle(g, r, T, T, 0xd8c6a4, 6);
    g.generateTexture(`cobble${v}`, T, T); g.destroy();
  }

  /* --- path edges -------------------------------------------------------
   * Grass fringe that hangs over the paving. Drawn ON TOP of a path tile
   * wherever its neighbour is grass. The dead-straight boundary between path
   * and grass was the clearest tell that this was rectangles, not a place. */
  const EDGE = ['n', 's', 'w', 'e'];
  EDGE.forEach((side, i) => {
    const r = rng(7700 + i * 53);
    g = s.add.graphics();
    for (let t = 0; t < T; t++) {
      const d = 3 + Math.floor(r() * 5);                 // how far the grass creeps in
      if (side === 'n') { px(g, t, 0, 1, d, PAL.grass[1]); px(g, t, d, 1, 1, PAL.grass[0], .5); }
      if (side === 's') { px(g, t, T - d, 1, d, PAL.grass[1]); px(g, t, T - d - 1, 1, 1, PAL.grass[0], .5); }
      if (side === 'w') { px(g, 0, t, d, 1, PAL.grass[1]); px(g, d, t, 1, 1, PAL.grass[0], .5); }
      if (side === 'e') { px(g, T - d, t, d, 1, PAL.grass[1]); px(g, T - d - 1, t, 1, 1, PAL.grass[0], .5); }
    }
    g.generateTexture(`edge-${side}`, T, T); g.destroy();
  });

  /* --- water: depth bands plus a foam rim --- */
  for (let v = 0; v < 2; v++) {
    const r = rng(3100 + v * 17);
    g = s.add.graphics();
    px(g, 0, 0, T, T, PAL.water[1]);
    for (let i = 0; i < 4; i++) {
      const w = 10 + Math.floor(r() * 14);
      px(g, Math.floor(r() * (T - w)), Math.floor(r() * T), w, 3, PAL.water[0], .5);
    }
    for (let i = 0; i < 3; i++) {

/* ---------------- scene ---------------- */

function preload() {}

function create() {
  scene = this;
  makeTextures(this);
  npcs = [];

  const ground = this.add.renderTexture(0, 0, W, H).setOrigin(0).setDepth(0);
  const gr = rng(31337);
  const pick = (base, n) => base + Math.floor(gr() * n);

  const ROAD_Y = 13;
  // Work out what every tile IS before drawing any of it. The edge fringes
  // below need to know a tile's neighbours, which the old draw-as-you-go
  // loop could not answer.
  const PAVED = [], WET = [];
  for (let y = 0; y < MAP_H; y++) { PAVED[y] = []; WET[y] = []; for (let x = 0; x < MAP_W; x++) { PAVED[y][x] = false; WET[y][x] = false; } }
  for (let x = 0; x < MAP_W; x++) { PAVED[ROAD_Y][x] = true; PAVED[ROAD_Y + 1][x] = true; }
  for (let y = ROAD_Y; y < MAP_H - 2; y++) { PAVED[y][18] = true; PAVED[y][19] = true; }
  for (let y = 11; y < 18; y++) for (let x = 16; x < 22; x++) PAVED[y][x] = true;
  for (const [ys, [x0, x1]] of Object.entries(POND)) {
    const y = Number(ys);
    for (let x = x0; x <= x1; x++) { WET[y][x] = true; PAVED[y][x] = false; }
  }

  // A garden path from each occupied door out to the lane. Without one the
  // houses sit on grass with no way in, which is what made them read as
  // scenery rather than as homes people come and go from.
  //
  // The path runs down the column the door is IN. It used to be the nearest
  // column by rounding, up to a tile beside the door, so a garden fence (whose
  // gate is centred on the path, below) crossed it like a shut gate. A building
  // south of the lane faces away from it: its path comes down the plot's
  // `side` and turns along the front to the door, instead of running under
  // the building into its back wall (owner, 2026-10-07: "no gates or objects
  // blocking paths").
  const pathCol = doorX => Math.floor(doorX / T);
  const layPath = (doorX, dy, x0, x1, side) => {
    const pave = (x, y) => { if (x >= 0 && y >= 0 && x < MAP_W && y < MAP_H && !WET[y][x]) PAVED[y][x] = true; };
    const dx = pathCol(doorX);
    if (dy <= ROAD_Y) { for (let y = dy; y <= ROAD_Y; y++) pave(dx, y); return; }
    const sx = side === 'right' ? Math.ceil(x1 / T) : Math.floor(x0 / T) - 1;
    for (let y = ROAD_Y + 1; y <= dy; y++) pave(sx, y);
    for (let x = Math.min(sx, dx); x <= Math.max(sx, dx); x++) pave(x, dy);
  };
  const occupied = Math.min(housed().length, PLOTS.length);
  for (let i = 0; i < occupied; i++) {
    const pl = PLOTS[i];
    layPath((pl.x + 2) * T, Math.round(pl.y + 3.7), pl.x * T, pl.x * T + 128, pl.side);
  }
  // ...the props hall, which is wider, so its door sits further in; south of
  // the lane, with Timmy's plot on its left, so its path comes down the right...
  layPath((PROPS_PLOT.x + 2.5) * T, Math.round(PROPS_PLOT.y + 3.9), PROPS_PLOT.x * T, PROPS_PLOT.x * T + 160, 'right');
  // ...and Clip's studio, whose door is at the middle of a 4.5-tile front.
  layPath((CLIP_PLOT.x + 2.25) * T, Math.round(CLIP_PLOT.y + 3.9), CLIP_PLOT.x * T, CLIP_PLOT.x * T + 144);

  window.__paved = PAVED;   // lets a check read the paths as drawn, not a copy of the rule

  const at = (grid, x, y) => (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) ? false : grid[y][x];

  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const plaza = x >= 16 && x <= 21 && y >= 11 && y <= 17;
    if (WET[y][x])        ground.draw(`water${pick(0, 2)}`, x * T, y * T);
    else if (plaza)       ground.draw(`cobble${pick(0, 3)}`, x * T, y * T);
    else if (PAVED[y][x]) ground.draw(`path${pick(0, 4)}`, x * T, y * T);
    else                  ground.draw(`grass${pick(0, 4)}`, x * T, y * T);
  }

  // Fringes last, over the top. A path tile whose neighbour is grass gets
  // grass hanging over that side; a grass tile next to water gets a shoreline.
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (PAVED[y][x]) {
      if (!at(PAVED, x, y - 1) && !at(WET, x, y - 1)) ground.draw('edge-n', x * T, y * T);
      if (!at(PAVED, x, y + 1) && !at(WET, x, y + 1)) ground.draw('edge-s', x * T, y * T);
      if (!at(PAVED, x - 1, y) && !at(WET, x - 1, y)) ground.draw('edge-w', x * T, y * T);
      if (!at(PAVED, x + 1, y) && !at(WET, x + 1, y)) ground.draw('edge-e', x * T, y * T);
    } else if (!WET[y][x]) {
      if (at(WET, x, y + 1)) ground.draw('shore-s', x * T, y * T);
      if (at(WET, x, y - 1)) ground.draw('shore-n', x * T, y * T);
      if (at(WET, x + 1, y)) ground.draw('shore-e', x * T, y * T);
      if (at(WET, x - 1, y)) ground.draw('shore-w', x * T, y * T);
    }
    if (WET[y][x]) {
      const N = !at(WET, x, y - 1), S = !at(WET, x, y + 1),
            Wd = !at(WET, x - 1, y), E = !at(WET, x + 1, y);
      if (N && Wd) ground.draw('wcorn-nw', x * T, y * T);
      if (N && E)  ground.draw('wcorn-ne', x * T, y * T);
      if (S && Wd) ground.draw('wcorn-sw', x * T, y * T);
      if (S && E)  ground.draw('wcorn-se', x * T, y * T);
    }
  }

  // flowers: decoration only, deterministic, never on paving
  const fl = this.add.graphics();
  px(fl, 2, 3, 1, 3, 0x3f7d3a); px(fl, 1, 1, 3, 3, 0xf2e06a);
  px(fl, 7, 5, 1, 3, 0x3f7d3a); px(fl, 6, 3, 3, 3, 0xffffff);
  px(fl, 11, 4, 1, 3, 0x3f7d3a); px(fl, 10, 2, 3, 3, 0xe8798f);
  fl.generateTexture('flowers', 14, 10); fl.destroy();
  const rnd = rng(20260914);
  for (let i = 0; i < 130; i++) {
    const tx = Math.floor(rnd() * MAP_W), ty = Math.floor(rnd() * MAP_H);
    const paved = PAVED[ty][tx] || WET[ty][tx] || (tx >= 16 && tx <= 21 && ty >= 11 && ty <= 17);
    if (!paved) ground.draw('flowers', tx * T + 8, ty * T + 10);
  }

  this.physics.world.setBounds(0, 0, W, H);
  const solids = this.physics.add.staticGroup();
  const blocker = (x, y, w, h) => solids.add(this.add.zone(x, y, w, h).setOrigin(.5));

  // One blocker per row of water, so you cannot walk across the narrow ends
  // of a pond that is no longer a rectangle.
  for (const [ys, [x0, x1]] of Object.entries(POND)) {
    const y = Number(ys), w = x1 - x0 + 1;
    blocker((x0 + w / 2) * T, (y + .5) * T, w * T, T);
  }

  // Lily pads sit on the water, so no shadow and no collision - you never walk
  // there anyway, the pond rows are blockers.
  [[3.4, 18.6], [6.2, 20.4], [7.6, 17.8], [2.6, 20.8], [5.0, 22.3]]
    .forEach(([tx, ty], i) => this.add.image(tx * T, ty * T, `lily${i % 2}`)
      .setOrigin(.5, 1).setDepth(ty * T - 6));
  [[1.4, 18.2], [9.4, 19.2], [2.2, 22.6], [8.6, 21.6], [0.8, 20.4]]
    .forEach(([tx, ty]) => this.add.image(tx * T, ty * T, 'reeds').setOrigin(.5, 1).setDepth(ty * T + 4));

  // --- scenery ---
  // `shade` puts an ellipse on the ground under a prop. Without it everything
  // looks pasted on top of the grass rather than standing in it.
  const place = (key, tx, ty, depthPad, solid, shade) => {
    if (shade) {
      const sh = this.add.image(tx * T, ty * T - 2, 'shadow').setOrigin(.5, .5);
      sh.setScale(shade, shade * .8).setDepth(ty * T - 1).setAlpha(.55);
    }
    const img = this.add.image(tx * T, ty * T, key).setOrigin(.5, 1);
    img.setDepth(ty * T + (depthPad || 0));
    if (solid) blocker(img.x, img.y - 8, img.width * 0.7, 14);
    return img;
  };

  // Nudged off the house plots - four of these used to grow through a wall,
  // and then three more grew through the props hall, which is not in PLOTS
  // and so was invisible to the first nudge. tests/test_parsers.py now checks
  // every coordinate below against every building's footprint, because
  // "nudged" is a thing someone remembers to do and a test is not.
  [[1,3],[4,1],[9,2],[20,2],[25,1],[34,1],[0,9],[36,4],
   [2,16],[8,17],[15,18],[22,20],[24,21],[29,15.5],[9.6,22.6],[24,15.5],[18,2],
   [7,11],[13,16],[10,15.5]]
    .forEach(([tx,ty], i) => place(`tree${i % 3}`, tx, ty, 40, true, .78));

  // [32,21] stood exactly in front of the props hall's name plate, which then
  // read "P    PROPS". Found by screenshotting the village, not by reading it.
  [[6,11],[14,11],[23,11],[29,11],[32.6,12],[3,12],[10,17],[14,20],[22,20],[28,18],[31,22],[17.5,19.6]]
    .forEach(([tx,ty]) => place('bush', tx, ty, 8, false, .42));

  [[7,16],[21,19],[30,16],[13,12],[27.5,12],[37.5,22.2]]
    .forEach(([tx,ty]) => place('rock', tx, ty, 6, true, .34));

  // fence runs along the bottom edge of the north gardens
  // [8..10, 11] ran across the front of Belfort's garden and [25..27, 11]
  // across Scout's, path and all - both plots sit lower than the north row.
  // Found by the fence check in tests/test_parsers.py, once it had one.
  // [4,11] and [31,11] stood across Ace's and Scout's paths.
  [[2,11],[3,11],[32,11]]
    .forEach(([tx,ty]) => place('fence', tx + .5, ty + .4, 6, false));

  // street lamps down the high street
  [[6,13],[13,13],[24,13],[32.4,13],[16.6,11.6],[21.4,11.6]]
    .forEach(([tx,ty]) => place('lamp', tx, ty, 30, false));

  [[5.8,12.4],[11.8,12.4],[28.5,12.4],[34.5,12.4]]
    .forEach(([tx,ty]) => place('bed', tx, ty, 4, false));

  // The plaza had nothing in it. Stalls beside the road and stacked goods
  // against the walls give the eye somewhere to land; the statue (below)
  // stands where a well used to.
  // [21.3, 12.6] stood across Clip's path into the square, and [16.7, 12.6]
  // overhung Emily's.
  [[17.0, 12.6], [22.0, 12.6]].forEach(([tx, ty]) => place('stall', tx, ty, 18, true, .7));
  [[15.4, 15.6], [22.6, 15.6], [8.6, 12.4], [26.8, 12.4]]
    .forEach(([tx,ty], i) => place(i % 2 ? 'barrel' : 'crate', tx, ty, 6, true, .32));
  // [11.4, 12.3] stood on the end of Belfort's name plate ("BELFOR-").
  [[13.4, 16.4], [24.6, 17.4], [6.4, 16.2], [30.4, 15.4], [12.5, 12.9], [30.2, 12.3]]
    .forEach(([tx,ty]) => place('sign', tx, ty, 6, false, .22));

  // --- town square: the statue, with the ledger on its plinth's plaque ---
  const statue = this.add.image(STATUE.x * T, STATUE.y * T, 'ironman').setOrigin(.5, 1)
    .setDepth(STATUE.y * T);
  blocker(statue.x, statue.y - 14, 124, 26);
  // the arc reactor and the raised palm glow, the way the house lamps pulse
  [[0, -150, 7], [-22, -193, 5]].forEach(([dx, dy, rad]) => {
    const glow = this.add.circle(statue.x + dx, statue.y + dy, rad, 0x9ff6ff, .55)
      .setDepth(statue.depth + 1).setBlendMode(Phaser.BlendModes.ADD);
    this.tweens.add({ targets: glow, alpha: .15, duration: 1200, yoyo: true, repeat: -1 });
  });
  boardText = this.add.text(statue.x, statue.y - 50, 'TOWN HALL', {
    fontFamily: 'ui-monospace,Menlo,monospace', fontSize: '15px', color: '#1f2e22', fontStyle: 'bold',
  }).setOrigin(.5).setDepth(statue.depth + 2);
  boardSub = this.add.text(statue.x, statue.y - 36, '', {
    fontFamily: 'ui-monospace,Menlo,monospace', fontSize: '9px', color: '#5c6b52',
  }).setOrigin(.5).setDepth(statue.depth + 2);

  // ---- one house per agent, auto-discovered ----
  doors = [];
  doors.push({ name: HALL_DOOR, x: statue.x, y: statue.y + 14 });
  const agents = housed();
  const HW = 128, HH = 116;
  const statusColor = { active: 0x34d399, idle: 0x22d3ee, stale: 0xfbbf24, waiting: 0x8791a8 };
  const ROOFS = [0xc0504d, 0x4f81bd, 0x9bbb59, 0x8064a2, 0xd99694, 0x4bacc6];
  // Tint multiplies, so an agent wearing its roof colour comes out nearly black.
  // These are the same hues lifted towards white so the little folk stay readable.
  const SHIRTS = [0xff9f9c, 0xa8c8f0, 0xd4ea9f, 0xcbb6e4, 0xf7c9c6, 0xa6e0ec];

  agents.forEach((a, i) => {
    const plot = PLOTS[i % PLOTS.length];
    const bx = plot.x * T;
    const by = plot.y * T;
    const theme = THEMED[a.name];
    // placed by the bottom edge: every door and garden stays where it was,
    // and a taller building rises from the same ground
    const house = this.add.image(bx, by + HH, theme ? `house-${a.name}` : `house-${i % 6}`)
      .setOrigin(0, 1).setDepth(by + HH);
    if (plot.flip && !theme) house.setFlipX(true);     // a mirrored ticker or painting reads backwards
    blocker(bx + HW/2, by + HH - 26, HW - 10, 50);

    // A garden gives the house a plot rather than leaving it standing loose on
    // open grass. The fence sits below the name plate, not through it, and
    // leaves the middle open as a gate so the path to the door reads.
    // A fence piece that would stand on paving is left out: the eighth plot's
    // garden runs down to the lane itself.
    const gy = by + HH + 58, gate = (pathCol(bx + HW/2) + .5) * T;   // the gap is the path
    [-2, -1, 1, 2].forEach(f => {
      const fx = gate + f * T, row = Math.floor((gy - 2) / T), col = Math.floor(fx / T);
      if (row < MAP_H && col >= 0 && col < MAP_W && PAVED[row][col]) return;
      this.add.image(fx, gy, 'fence').setOrigin(.5, 1).setDepth(gy - 2);
    });
    // South of the lane the path runs along half the front, so the flower
    // bed and the prop both go on the other half; north of it, one each side.
    const propLeft = plot.side ? plot.side === 'right' : plot.flip;
    const bedRight = plot.side ? plot.side === 'left' : plot.flip;
    this.add.image(bx + (bedRight ? HW - 18 : 18), by + HH + 6, 'bed')
      .setOrigin(.5, 1).setDepth(by + HH + 8);
    // a themed house's prop stands where the bush would: in front of the
    // wall it hid a window (Ace's hoop), under it a fence hid it (the bull)
    this.add.image(bx + (propLeft ? -6 : HW + 6), by + HH + 14, theme ? theme.prop : 'bush')
      .setOrigin(.5, 1).setDepth(by + HH + 16);

    const plateW = Math.max(70, a.name.length * 10 + 22);
    this.add.rectangle(bx + HW/2, by + HH + 18, 6, 14, 0x7a5230).setDepth(by + HH + 24);
    this.add.rectangle(bx + HW/2, by + HH + 8, plateW, 20, 0xd9c9a3)
      .setStrokeStyle(2, 0x8a7a5c).setDepth(by + HH + 25);
    this.add.text(bx + HW/2, by + HH + 8, a.name.toUpperCase(), {
      fontFamily: 'ui-monospace,Menlo,monospace', fontSize: '12px', color: '#2b3a2e',
    }).setOrigin(.5).setDepth(by + HH + 26);

    const [lx, ly] = theme ? [theme.lamp[0], HH - theme.h + theme.lamp[1]] : [HW / 2, 22];
    const lamp = this.add.circle(bx + lx, by + ly, 6, statusColor[a.status] || 0x8791a8)
      .setStrokeStyle(1, 0x00000055).setDepth(by + HH + 27);
    this.tweens.add({ targets: lamp, alpha: .3, duration: 1000, yoyo: true, repeat: -1 });

    const doorX = bx + HW/2, doorY = by + HH;
    doors.push({ name: a.name, x: doorX, y: doorY });

    // ---- the agent, pottering about outside its own house ----
    const lk = look(a.name);
    // Below the sign is the resident's spot. A south plot has no room there -
    // its front is the edge of the map - so its resident keeps to the side its
    // path comes down, above the sign rather than below it.
    const room = H - doorY > 64 + 28;
    const home = room ? { x: doorX, y: doorY + 64, minY: doorY + TAG_CLEAR }
      : { x: plot.side === 'right' ? (Math.ceil((bx + HW) / T) + .5) * T : (Math.floor(bx / T) - .5) * T,
          y: doorY - 48, maxY: doorY - 24 };
    const npc = this.physics.add.sprite(home.x + (room ? 34 : 0), home.y, `${lk}-down-0`);
    if (lk === 'hero') npc.setTint(SHIRTS[i % 6]);      // a plain villager, told apart by shirt
    npc.body.setSize(14, 12).setOffset(5, 16);
    npc.setDepth(npc.y);
    this.physics.add.collider(npc, solids);
    npcs.push({
      s: npc, homeX: home.x, homeY: home.y, look: lk, minY: home.minY, maxY: home.maxY,
      tx: home.x, ty: home.y, wait: 400 + Math.floor(rnd() * 1400), moving: false,
      label: nameTag(this, npc.x, npc.y - 22, a.name.charAt(0).toUpperCase() + a.name.slice(1)),
    });
  });

  // ---- the props hall ----
  {
    const SW = 160, SH = 124;
    const bx = PROPS_PLOT.x * T, by = PROPS_PLOT.y * T;
    this.add.image(bx, by, 'sportshall').setOrigin(0, 0).setDepth(by + SH);
    blocker(bx + SW / 2, by + SH - 26, SW - 12, 52);

    // one goal, on the left: the right-hand one stood on the hall's own path
    this.add.image(bx - 10, by + SH + 10, 'goalpost').setOrigin(.5, 1).setDepth(by + SH + 12);

    const plateW = Math.max(96, PROPS_DOOR.length * 10 + 22);
    this.add.rectangle(bx + SW / 2, by + SH + 18, 6, 14, 0x7a5230).setDepth(by + SH + 24);
    this.add.rectangle(bx + SW / 2, by + SH + 8, plateW, 20, 0xd9c9a3)
      .setStrokeStyle(2, 0x8a7a5c).setDepth(by + SH + 25);
    this.add.text(bx + SW / 2, by + SH + 8, PROPS_DOOR.toUpperCase(), {
      fontFamily: 'ui-monospace,Menlo,monospace', fontSize: '12px', color: '#2b3a2e',
    }).setOrigin(.5).setDepth(by + SH + 26);

    doors.push({ name: PROPS_DOOR, x: bx + SW / 2, y: by + SH });
  }

  // ---- Clip's studio ----
  {
    const SW = 144, SH = 124;
    const bx = CLIP_PLOT.x * T, by = CLIP_PLOT.y * T;
    this.add.image(bx, by, 'clipstudio').setOrigin(0, 0).setDepth(by + SH);
    blocker(bx + SW / 2, by + SH - 26, SW - 12, 52);
    this.add.image(bx + 20, by + SH + 16, 'tripodcam').setOrigin(.5, 1).setDepth(by + SH + 16);
    this.add.image(bx + SW - 20, by + SH + 16, 'ringlight').setOrigin(.5, 1).setDepth(by + SH + 16);

    const plateW = Math.max(96, CLIP_DOOR.length * 10 + 22);
    this.add.rectangle(bx + SW / 2, by + SH + 18, 6, 14, 0x7a5230).setDepth(by + SH + 24);
    this.add.rectangle(bx + SW / 2, by + SH + 8, plateW, 20, 0xd9c9a3)
      .setStrokeStyle(2, 0x8a7a5c).setDepth(by + SH + 25);
    this.add.text(bx + SW / 2, by + SH + 8, CLIP_DOOR.toUpperCase(), {
      fontFamily: 'ui-monospace,Menlo,monospace', fontSize: '12px', color: '#2b3a2e',
    }).setOrigin(.5).setDepth(by + SH + 26);
    doors.push({ name: CLIP_DOOR, x: bx + SW / 2, y: by + SH });

    // Clip, and Spotter its research assistant, each with a name over their
    // head - two people outside one door would otherwise be anyone.
    [['Clip', -34], ['Spotter', 38]].forEach(([who, off]) => {
      const hx = bx + SW / 2 + off, hy = by + SH + 60;   // below the sign, so the tags never cover it
      const lk = look(who.toLowerCase());
      const npc = this.physics.add.sprite(hx, hy, `${lk}-down-0`);
      npc.body.setSize(14, 12).setOffset(5, 16);
      this.physics.add.collider(npc, solids);
      const label = nameTag(this, hx, hy - 22, who);
      npcs.push({ s: npc, homeX: hx, homeY: hy, tx: hx, ty: hy, look: lk, minY: by + SH + TAG_CLEAR,
                  wait: 400 + Math.floor(rnd() * 1400), moving: false, label });
    });
  }

  if (!agents.length) {
    this.add.text(W/2, 7*T, 'No agents yet —\nadd one and a house appears here.', {
      fontFamily: 'ui-sans-serif,system-ui', fontSize: '17px', color: '#ffffff',
      align: 'center', backgroundColor: '#00000066', padding: { x: 16, y: 12 },
    }).setOrigin(.5).setDepth(9000);
  }

  // ---- player ----
  ['down','up','side'].forEach(f => {
    this.anims.create({ key: `walk-${f}`, frames: [{key:`hero-${f}-0`},{key:`hero-${f}-1`}], frameRate: 7, repeat: -1 });
    Object.keys(OUTFITS).forEach(who => this.anims.create({ key: walkAnim(`npc-${who}`, f),
      frames: [{ key: `npc-${who}-${f}-0` }, { key: `npc-${who}-${f}-1` }], frameRate: 7, repeat: -1 }));
  });
  player = this.physics.add.sprite(9*T, ROAD_Y*T + 22, 'hero-down-0');
  player.setCollideWorldBounds(true);
  player.body.setSize(14, 12).setOffset(5, 16);
  this.physics.add.collider(player, solids);

  this.cameras.main.setBounds(0, 0, W, H);
  this.cameras.main.startFollow(player, true, .12, .12);
  this.cameras.main.setZoom(zoomForViewport());

  this.input.keyboard.on('keydown', e => {
    // Typing in a box is typing, not walking: an "e" in a caption used to
    // open the house again and throw away what was being written.
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'e' && nearDoor) openPanel(nearDoor.name);
    // Escape peels one layer at a time: the enlarged image first,
    // then the panel, so it never dumps you back outside in one press.
    if (e.key === 'Escape') {
      if ($('lb').classList.contains('on')) closeLb();
      else if ($('doc').classList.contains('on')) closeDoc();
      else closePanel();
    }
  });
  this.input.keyboard.on('keyup', e => { keys[e.key.toLowerCase()] = false; });

  this.input.on('pointerdown', pt => {
    if (openAgent) return;
    const wp = this.cameras.main.getWorldPoint(pt.x, pt.y);
    const hit = doors.find(dr => Math.abs(wp.x - dr.x) < 68 && wp.y > dr.y - 118 && wp.y < dr.y + 26);
    if (hit) openPanel(hit.name);
  });

  window.__npcs = npcs;          // exposed for debugging / verification
  window.__openPanel = openPanel; // ditto - lets a panel be opened without walking to it
  $('boot').style.display = 'none';
  if (isTouch()) $('stick').style.display = 'block';
}

function zoomForViewport() {
  // Show roughly 800px of world width: enough for three or four houses at once.
  const z = Math.min(window.innerWidth / 800, window.innerHeight / 560);
  return Math.max(1.0, Math.min(1.9, z));
}

function update() {
  if (!player) return;
  const SP = 170;
  let vx = 0, vy = 0;

  if (!openAgent) {
    if (keys['arrowleft'] || keys['a']) vx -= 1;
    if (keys['arrowright'] || keys['d']) vx += 1;
    if (keys['arrowup'] || keys['w']) vy -= 1;
    if (keys['arrowdown'] || keys['s']) vy += 1;
    if (touch.active) { vx += touch.dx; vy += touch.dy; }
  }

  const mag = Math.min(1, Math.hypot(vx, vy));
  const len = Math.hypot(vx, vy) || 1;
  player.setVelocity((vx/len) * SP * mag, (vy/len) * SP * mag);

  if (mag > .12) {
    if (Math.abs(vx) > Math.abs(vy)) { player.anims.play('walk-side', true); player.setFlipX(vx < 0); }
    else if (vy < 0) { player.anims.play('walk-up', true); player.setFlipX(false); }
    else { player.anims.play('walk-down', true); player.setFlipX(false); }
  } else {
    player.anims.stop();
    const cur = player.anims.currentAnim ? player.anims.currentAnim.key.replace('walk-', 'hero-') : 'hero-down';
    player.setTexture(cur + '-0');
  }
  player.setDepth(player.y);

  // ---- agents pottering about outside their houses ----
  const now = this.time.now;
  for (const n of npcs) {
    const NSP = 40, R = 86;
    const dx = n.tx - n.s.x, dy = n.ty - n.s.y;
    const dist = Math.hypot(dx, dy);
    if (n.moving) {
      if (dist < 6) {
        n.moving = false;
        n.s.setVelocity(0, 0);
        n.s.anims.stop();
        n.s.setTexture(`${n.look}-down-0`);
        n.wait = now + 900 + Math.random() * 3200;      // stand about for a bit
      } else {
        n.s.setVelocity((dx/dist) * NSP, (dy/dist) * NSP);
        if (Math.abs(dx) > Math.abs(dy)) { n.s.anims.play(walkAnim(n.look, 'side'), true); n.s.setFlipX(dx < 0); }
        else if (dy < 0) { n.s.anims.play(walkAnim(n.look, 'up'), true); n.s.setFlipX(false); }
        else { n.s.anims.play(walkAnim(n.look, 'down'), true); n.s.setFlipX(false); }
      }
    } else if (now > n.wait) {
      n.tx = n.homeX + (Math.random() * 2 - 1) * R;
      n.ty = Math.min(n.maxY ?? Infinity, Math.max(n.minY ?? -Infinity, n.homeY + (Math.random() * 2 - 1) * R * 0.5));
      n.moving = true;
    }
    n.s.setDepth(n.s.y);
    if (n.label) n.label.setPosition(n.s.x, n.s.y - 14).setDepth(8000 + n.s.y);   // over any prop
  }

  // ---- town square: the plaque says TOWN HALL, the ledger goes under it ----
  if (boardSub) {
    const k = DATA.kpis || {};
    if (k.total_value === null || k.total_value === undefined) {
      boardSub.setText('NO LEDGER YET').setColor('#5c6b52');
    } else {
      boardSub.setText(`${money(k.total_value)}  ${pctTxt(k.total_pnl_pct)}`)
        .setColor(k.total_pnl >= 0 ? '#1d6b45' : '#8c2f3f');
    }
  }

  // ---- nearest door ----
  nearDoor = null;
  let best = 92;
  for (const dr of doors) {
    const dd = Phaser.Math.Distance.Between(player.x, player.y, dr.x, dr.y);
    if (dd < best) { best = dd; nearDoor = dr; }
  }
  const prompt = $('prompt'), act = $('act');
  if (nearDoor && !openAgent) {
    prompt.style.display = 'block';
    prompt.innerHTML = isTouch()
      ? `<b>${esc(nearDoor.name)}</b> — tap ENTER`
      : `<b>${esc(nearDoor.name)}</b> — press <b>E</b>`;
    if (isTouch()) act.style.display = 'block';
  } else {
    prompt.style.display = 'none';
    act.style.display = 'none';
  }
}

let ideaBusy = false;

async function actOnIdea(id, verb) {
  if (ideaBusy) return;
  let reason = '';
  if (verb === 'reject') {
    reason = (window.prompt('Why? Scout reads this so it does not propose it again.') || '').trim();
    if (!reason) return;
  } else {
    reason = (window.prompt('Note for the record (optional):', 'approved from the village') || 'approved from the village').trim();
  }
  ideaBusy = true;
  document.querySelectorAll('.acts button').forEach(b => b.disabled = true);
  try {
    const r = await fetch(`/api/scout/ideas/${id}/${verb}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason }),
    });
    const j = await r.json();
    if (!r.ok || j.ok === false) alert((j.error || j.stderr || 'That did not work').slice(0, 300));
    else if (verb === 'approve') alert('Approved and queued to Emily.\n\n' + (j.stdout || ''));
  } catch (e) {
    alert('Could not reach the API: ' + e.message);
  } finally {
    ideaBusy = false;
    loadScoutIdeas();
  }
}

let openIdea = null, IDEAS = [], SCOUT_FOCUS = null;

function ideaSlug(i){
  const ev = i.evidence || {};
  const when = String(ev.measured_at || i.proposed_at || '').slice(0, 10);
  const words = String(i.title || 'untitled').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return (when ? when + '-' : '') + words;
}

// CONFIDENCE IN THE MEASUREMENT, NOT IN THE SALE.
//
// The interface this copies shows "8/10" next to an invented revenue range,
// and a confidence score over a made-up number is decoration. This one is
// computed from three things that are facts about the data: how many of the
// listings Etsy returned actually contained the phrase, how many rows the
// medians were taken from, and how long ago it was measured. Every point is
// listed underneath, so the number can be checked rather than trusted.
function confidence(ev){
  if(!ev || !ev.phrase) return null;
  const parts = [], m = ev.match, n = ev.heat_n, age = scanAge(ev.measured_at);
  let score = 0;
  if(typeof m === 'number'){
    const pts = m >= 0.9 ? 4 : m >= 0.7 ? 3 : m >= 0.5 ? 2 : 0;
    score += pts;
    parts.push(`${Math.round(m * 100)}% of listings matched the phrase (+${pts})`);
  }
  if(typeof n === 'number'){
    const pts = n >= 20 ? 3 : n >= 10 ? 2 : n >= 5 ? 1 : 0;
    score += pts;
    parts.push(`medians from ${n} listings (+${pts})`);
  }
  if(age !== null){
    const pts = age <= 3 ? 3 : age <= 7 ? 2 : age <= 14 ? 1 : 0;
    score += pts;
    parts.push(`measured ${age === 0 ? 'today' : age + ' day' + (age === 1 ? '' : 's') + ' ago'} (+${pts})`);
  }
  return { score: Math.min(score, 10), parts };
}

function scanAge(stamp){
  const t = Date.parse(String(stamp || ''));
  if(!isFinite(t)) return null;
  return Math.max(0, Math.floor((Date.now() - t) / 86400000));
}

// Named for this panel, not generically: `money` already exists above and
// the whole file is one scope, so a second one silently shadows or throws.
const evPrice = v => typeof v === 'number' ? '$' + v.toFixed(2) : null;
const evCount = v => typeof v === 'number' ? v.toLocaleString() : null;

function cell(title, big, small, missing){
  if(big === null || big === undefined)
    return `<div class="vcell none"><h4>${esc(title)}</h4>
      <div class="big">not measured</div>
      <div class="sm">${esc(missing || 'nothing was guessed in its place.')}</div></div>`;
  return `<div class="vcell"><h4>${esc(title)}</h4><div class="big">${big}</div>`
       + (small ? `<div class="sm">${small}</div>` : '') + `</div>`;
}

function evidencePanels(i){
  const ev = i.evidence || {};
  if(!ev.phrase){
    return `<div class="vcell none" style="margin-bottom:10px">
      <h4>Evidence</h4><div class="big">none</div>
      <div class="sm">Proposed before measurements were required, or by hand.
      Nothing here has been checked against Etsy — approving it is a guess,
      the same as every idea was before.</div></div>`;
  }
  const c = confidence(ev), age = scanAge(ev.measured_at);
  const crowded = typeof ev.supply === 'number' && ev.supply >= 50000;
  return `<div class="vgrid">
    ${cell('Competition', evCount(ev.supply) ? evCount(ev.supply) + ' <span class="sm" style="display:inline">listings</span>' : null,
           crowded ? 'Crowded. The design is first seen as a thumbnail in a grid, so it was briefed for bold shapes and high contrast.'
                   : 'Narrow enough to be specific rather than broadly safe.')}
    ${cell('Demand', typeof ev.favs_per_day === 'number' ? ev.favs_per_day.toFixed(3) + ' <span class="sm" style="display:inline">favs/day</span>' : null,
           typeof ev.favs_per_view === 'number'
             ? (ev.favs_per_view * 100).toFixed(1) + '% of people who look, save one'
             : 'favourites per view was not readable on these listings.')}
    ${cell('Price band', evPrice(ev.typical_price),
           'Median asking price in this market. An anchor, not a margin.')}
    ${cell('Executor', 'Emily', esc(i.product || 'product') + ' &middot; drafts only, never publishes')}
    ${cell('Confidence', c ? c.score + '<span class="sm" style="display:inline">/10</span>' : null,
           c ? c.parts.map(esc).join('<br>') : null,
           'in the measurement, not in the sale.')}
    ${cell('Measured', age === null ? null : (age === 0 ? 'today' : age + ' day' + (age === 1 ? '' : 's') + ' ago'),
           'from the scan of ' + esc(ev.from_scan || 'an unnamed seed'))}
  </div>
  <div class="vcell"><h4>Phrase this is aimed at</h4>
    <div class="big" style="font-family:ui-monospace,monospace;font-size:13px">${esc(ev.phrase)}</div>
    ${(ev.tags || []).length ? `<div class="sm">Sellers there call it: ${esc((ev.tags || []).slice(0, 8).join(', '))}</div>` : ''}
    ${ev.ip_flag ? `<div class="sm" style="color:#f59e0b">IP FLAG &mdash; ${esc(ev.ip_flag)}. An ordinary word that is also a property. Your call.</div>` : ''}
  </div>`;
}

function toggleIdea(id){
  openIdea = (openIdea === id) ? null : id;
  drawIdeas();
}

function drawIdeas(){
  const host = document.getElementById('scoutIdeas');
  if(!host) return;
  const pending = IDEAS.filter(i => (i.status || 'pending') === 'pending');
  const tally = {
    pending: pending.length,
    approved: IDEAS.filter(i => i.status === 'approved').length,
    rejected: IDEAS.filter(i => i.status === 'rejected').length,
  };
  const head = `<div class="vtally">
    <div class="vt lead"><b>${tally.pending}</b><span>Pending verdict</span></div>
    <div class="vt"><b>${tally.approved}</b><span>Approved</span></div>
    <div class="vt"><b>${tally.rejected}</b><span>Rejected</span></div>
  </div>` + (SCOUT_FOCUS ? `<div class="verdict" style="margin:0 0 12px">
    <b>Focus: ${esc(SCOUT_FOCUS)} only.</b> Every idea Scout proposes is a ${esc(SCOUT_FOCUS)},
    and code refuses anything else. It stays on until you clear it:
    <code>scripts/scout-ideas.py focus --clear</code></div>` : '');

  if(!pending.length){
    host.innerHTML = head + `<div class="muted">Nothing waiting on you. Scout proposes
      again on its next run, and only from a phrase that has been measured.</div>`;
    return;
  }

  host.innerHTML = head + pending.map(i => {
    const ev = i.evidence || {};
    const open = openIdea === i.id;
    const gist = ev.phrase
      ? `${evCount(ev.supply) || '?'} listings &middot; ${typeof ev.favs_per_day === 'number' ? ev.favs_per_day.toFixed(3) : '?'}/day`
      : 'no evidence';
    return `<div class="vrow${open ? ' open' : ''}">
      <div class="vhead" onclick="toggleIdea(${Number(i.id)})">
        <span class="vtag">proposed</span>
        <span class="vslug">${esc(ideaSlug(i))}</span>
        <span class="vnum">${gist}</span>
      </div>
      ${open ? `<div class="vbody">
        ${i.angle ? `<div class="d" style="margin-bottom:8px">${esc(i.angle)}</div>` : ''}
        ${i.brief ? `<div class="d" style="margin-bottom:10px">${esc(i.brief)}</div>` : ''}
        ${evidencePanels(i)}
        <div class="acts">
          <button class="no"  onclick="event.stopPropagation();actOnIdea(${Number(i.id)},'reject')">✗ Reject</button>
          <button class="yes" onclick="event.stopPropagation();actOnIdea(${Number(i.id)},'approve')">✓ Approve</button>
        </div>
      </div>` : ''}
    </div>`;
  }).join('') + `<div class="vfoot">
    Every verdict is logged to Emily's lessons, and a rejection tells Scout why.<br>
    None of the numbers above was typed by a model &mdash; each was copied from a
    market scan, and an idea with no measurement behind it cannot be filed at all.
  </div>`;
}

async function loadScoutIdeas() {
  const host = document.getElementById('scoutIdeas');
  if (!host) return;
  try {
    const r = await fetch('/api/scout/ideas', { cache: 'no-store' });
    const d = await r.json();
    IDEAS = d.ideas || [];
    SCOUT_FOCUS = d.focus || null;

function showLb(i) {

  [...$('lbbar').children].forEach((b, n) => b.className = n === i ? 'sel' : '');
}
function closeLb() { $('lb').classList.remove('on'); $('lbimg').src = ''; }

const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB';

// Say plainly whether a build is finished and whether the art is real. A
// placeholder thumbnail looks like art until you open it.
function buildPills(b) {
  const p = [];
  // The words come from the API (emily.js statusWords), shared with the Deck.
  const w = b.status_words || { label: String(b.status).replace(/_/g, ' ') };
  if (b.status === 'ready_for_review') p.push(['ok', 'ready']);
  else p.push([w.warn ? 'warn' : '', w.label]);
  if (b.art_mode === 'placeholder') p.push(['warn', 'placeholder']);
  if (b.listing_error) p.push(['warn', 'listing unreadable']);
  return p.map(([c, t]) => `<span class="pill ${c}">${esc(t)}</span>`).join('');
}

// Why there is no Printify draft, in the drafter's own words. The village
// gallery said LOCAL ONLY and stopped, same as the Deck did, and the reason
// sat in a dispatcher log nobody reads.
function blockedReason(b){
  if (b.published || b.printify) return '';
  if (b.status_words && b.status_words.note) return b.status_words.note;
  if (b.draft_blocked && b.draft_blocked.reason) return b.draft_blocked.reason;
  if (b.listing_error) return `listing.json will not parse — ${b.listing_error}`;
  return '';
}

async function openDoc(agent, file){
  docAgent = agent;
  $('docwho').textContent = agent;
  $('docwhen').textContent = 'loading\u2026';
  $('docbody').innerHTML = '';
  $('docdays').innerHTML = '';
  $('doc').classList.add('on');
  try{
    const r = await fetch(`/api/reports/${encodeURIComponent(agent)}`, {cache:'no-store'});
    docFiles = (await r.json()).reports || [];

    $('docwhen').textContent = '';

    return;

    `<button data-f="${esc(f.name)}" onclick="showDoc('${esc(f.name)}')">${esc(f.name.replace(/\.md$/,''))}</button>`).join('');
  showDoc(file && docFiles.some(f=>f.name===file) ? file : docFiles[0].name);
}

async function showDoc(file){
  [...$('docdays').children].forEach(b => b.className = b.dataset.f === file ? 'sel' : '');
  $('docbody').innerHTML = '<div class="muted">loading\u2026</div>';
