<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d16">
<title>Bolt</title>
<!-- Bolt's crypto desk (owner, 2026-10-13), in the style of Belfort's Markets
     page and Peter's desk. Every number comes from `bolt.py board` through
     /api/bolt/board: the page draws, and works nothing out - not the score,
     not the averages, not the account. Opened inside his house in the village
     (?embed=1) and as its own tab from the Command Deck. -->
<style>
  :root{
    --bg:#0a0d16; --panel:#0e1220; --panel2:#121729; --line:rgba(255,255,255,.07);
    --gold:#f7931a; --gold2:#ffb04a; --ink:#e9e4d4; --mute:#8b90a0; --dim:#596074;
    --up:#2fd39b; --down:#f0646f; --warn:#f2c14e; --c20:#4cc9f0; --c50:#a78bfa;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:13px/1.5 var(--mono);-webkit-font-smoothing:antialiased;padding:14px}
  body.embed{padding:10px;background:rgba(5,7,12,.92)}
  .frame{max-width:1500px;margin:0 auto;border:1.5px solid var(--gold);border-radius:10px;background:var(--panel);
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 18px 60px rgba(0,0,0,.55);overflow:hidden}
  .num{font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--mute)}
  .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .muted{color:var(--mute)}

  .head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
  .title{font-size:24px;font-weight:700;letter-spacing:.18em}
  .title b{color:var(--gold)}
  .who{color:var(--mute);letter-spacing:.12em;font-size:11.5px;text-transform:uppercase}
  .sp{flex:1}
  .acct{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;margin-left:8px}
  .acct .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .acct .v{font-size:19px;font-weight:800}
  .acct .v.big{font-size:22px;color:var(--gold2)}
  .btn{font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none}
  .btn:hover{border-color:var(--gold)}

  /* the race: Bolt against BTC held from his first day */
  .show{padding:12px 20px 14px;border-bottom:1px solid var(--line)}
  .showtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px;flex-wrap:wrap}
  .race{display:grid;grid-template-columns:170px 1fr 78px;gap:10px;align-items:center;margin:6px 0}
  .race .n{font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .track{position:relative;height:22px;background:rgba(255,255,255,.03);border-radius:4px}
  .track .zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
  .bar{position:absolute;top:2px;bottom:2px;border-radius:3px}
  .bar.pos{left:50%;background:linear-gradient(90deg,rgba(47,211,155,.25),rgba(47,211,155,.75))}
  .bar.neg{right:50%;background:linear-gradient(270deg,rgba(240,100,111,.25),rgba(240,100,111,.75))}
  .race .v{text-align:right;font-weight:700}
  .status{display:flex;gap:14px;flex-wrap:wrap;padding:9px 20px;border-bottom:1px solid var(--line);color:var(--mute);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
  .status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px;vertical-align:1px}
  .err{color:var(--down)} .warnc{color:var(--warn)}

  .grid{display:grid;grid-template-columns:270px minmax(0,1fr) 400px;gap:14px;padding:14px 20px 20px}
  .box{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px}
  .empty{color:var(--mute);padding:20px 4px;text-align:center}
  .watch{display:flex;flex-direction:column;gap:10px}
  .w{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel2)}
  .w.on{border-color:var(--gold);background:rgba(247,147,26,.07)}
  .w .sym{font-weight:700;font-size:14px;letter-spacing:.05em}
  .w .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .w .px{font-size:17px;font-weight:700}
  .w .why{font-size:11px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{display:inline-block;font-size:10.5px;letter-spacing:.12em;padding:3px 8px;border-radius:4px;border:1px solid;white-space:nowrap}
  .b-HELD{color:var(--gold2);border-color:var(--gold)}
  .b-BUY{color:var(--up);border-color:var(--up)}
  .b-WATCH{color:var(--c20);border-color:rgba(76,201,240,.6)}
  .b-OUT{color:var(--dim);border-color:var(--line)}
  .dotv{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
  .center{display:flex;flex-direction:column;gap:14px;min-width:0}
  .tick{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .tick > div:first-child{flex:1 1 320px;min-width:0}
  .tick > div:last-child{flex:0 0 auto;margin-left:auto;text-align:right}
  .tick .s{font-size:30px;font-weight:800;letter-spacing:.04em}
  .tick .p{font-size:32px;font-weight:800;text-align:right}
  .gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .g{text-align:center}
  .g .big{font-size:22px;font-weight:800;margin-top:4px}
  .rub{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
  .rub:first-of-type{border-top:0}
  .rub .pt{font-weight:800}
  .rub.ok .pt{color:var(--up)} .rub.no{color:var(--dim)}
  .scorebig{font-size:34px;font-weight:800}
  .pos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
  .pos .stat{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
  .pos .l{color:var(--mute);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
  .pos .v{font-size:15px;font-weight:800}
  svg text{font-family:var(--mono)}

  .tabs{display:flex;border-bottom:1px solid var(--line);margin:-14px -14px 12px}
  .tab{flex:1;font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:11px 6px;color:var(--mute);
    background:transparent;border:0;border-bottom:2px solid transparent;cursor:pointer}
  .tab.on{color:var(--gold2);border-bottom-color:var(--gold);background:rgba(247,147,26,.06)}
  .doc{max-height:calc(100vh - 230px);overflow:auto;font-size:12.5px;line-height:1.65}
  .doc h1,.doc h2,.doc h3{color:var(--gold2);letter-spacing:.06em;font-size:14px;margin:16px 0 6px}
  .doc h1{font-size:17px}
  .doc table,.tbl{border-collapse:collapse;width:100%;font-size:11.5px}
  .doc td,.doc th,.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
  .tbl th{color:var(--mute);font-weight:400;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
  .tw{overflow-x:auto}
  .hist button{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:transparent;
    border:0;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer}
  .hist button:hover{color:var(--gold2)}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
  .stats .stat{border:1px solid var(--line);border-radius:6px;padding:8px}
  .stats .l{color:var(--mute);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
  .stats .v{font-size:16px;font-weight:800}
  .rules li{margin:5px 0}
  .sect{color:var(--gold2);letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin:16px 0 6px}

  @media (max-width:1180px){ .grid{grid-template-columns:240px minmax(0,1fr)} .right{grid-column:1 / -1} .doc{max-height:none} }
  @media (max-width:760px){
    body{padding:6px} .grid{grid-template-columns:1fr;padding:10px} .race{grid-template-columns:110px 1fr 64px}
    .gauges,.pos{grid-template-columns:repeat(2,1fr)} .watch{flex-direction:row;overflow-x:auto} .w{min-width:210px}
    .tick .s{font-size:24px} .tick .p{font-size:24px;text-align:left}
  }
</style>
<script src="/shared/md.js"></script>
</head>
<body>
<div class="frame">
  <div class="head">
    <div class="title"><b>⚡</b>BOLT</div>
    <div class="who">Bolt · crypto momentum · paper $10,000 · plain code, no AI</div>
    <div class="acct" id="acct"></div>
    <div class="sp"></div>
    <a class="btn" id="back" href="/dashboard">← Deck</a>
    <button class="btn" id="close" style="display:none">✕ Esc</button>
  </div>
  <div class="show">
    <div class="showtop"><div class="k">The race — Bolt against BTC bought on his first day and held</div>
      <div class="k" id="since"></div></div>
    <div id="race"><div class="empty">loading…</div></div>
    <div id="curve"></div>
  </div>
  <div class="status" id="status"><span><span class="dot"></span>loading</span></div>
  <div class="grid">
    <div><div class="k" style="margin-bottom:8px">The ten coins · <span id="wcount">0</span></div>
      <div class="watch" id="watch"></div></div>
    <div class="center" id="center"><div class="box empty">loading…</div></div>
    <div class="right box">
      <div class="tabs" id="tabs">
        <button class="tab on" data-t="report">Report</button>
        <button class="tab" data-t="history">History</button>
        <button class="tab" data-t="trades">Trades</button>
        <button class="tab" data-t="rules">Rules</button>
      </div>
      <div class="doc" id="side"></div>
    </div>
  </div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has = v => v !== null && v !== undefined;
const money = v => has(v) ? '$' + Number(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) : '—';
// A coin's price: $83,134 or $0.2338 - as many places as the price needs.
const price = v => !has(v) ? '—' : '$' + Number(v).toLocaleString('en-US',
  {maximumFractionDigits: v >= 1000 ? 0 : v >= 1 ? 2 : 4, minimumFractionDigits: v >= 1000 ? 0 : v >= 1 ? 2 : 4});
const pct = (v, d = 2) => has(v) ? (v > 0 ? '+' : '') + Number(v).toFixed(d) + '%' : '—';
const cls = v => !has(v) ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const big = v => !has(v) ? '—' : v >= 1e9 ? '$' + (v/1e9).toFixed(1)+'B' : v >= 1e6 ? '$' + (v/1e6).toFixed(0)+'M' : '$' + Math.round(v);
const when = iso => iso ? new Date(iso).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '—';
const clock = iso => iso ? new Date(iso).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '—';

const EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) {
  document.body.classList.add('embed');
  $('back').style.display = 'none';
  $('close').style.display = '';
  const close = () => parent.postMessage({ type: 'bolt-close' }, '*');
  $('close').onclick = close;
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
}

let B = null, sel = null, tab = 'report', shownReport = null;

async function load() {
  try {
    const r = await fetch('/api/bolt/board', { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || r.status);
    B = j;
    if (!sel || !B.coins.some(c => c.symbol === sel)) {
      const first = B.positions[0] ? B.positions[0].symbol : (B.coins[0] || {}).symbol;
      sel = first || null;
    }
    render();
  } catch (e) {
    $('status').innerHTML = `<span class="err">Could not read Bolt's board: ${esc(e.message)}</span>`;
  }
}

// What a coin card says it is: held, a buy-grade score, out, or watched.
function verdict(c) {
  if (c.held) return 'HELD';
  if (c.out) return 'OUT';
  return c.score >= B.rules.min_score ? 'BUY' : 'WATCH';
}
const badge = c => `<span class="badge b-${verdict(c)}">${verdict(c)}${c.held ? '' : ' · ' + c.score + '/10'}</span>`;

function render() {
  const signed = v => (v > 0 ? '+' : v < 0 ? '-' : '') + money(Math.abs(v));
  $('acct').innerHTML = `
    <div><div class="l">Account value</div><div class="v big num">${money(B.equity)}</div></div>
    <div><div class="l">Since start</div><div class="v num ${cls(B.pnl)}">${signed(B.pnl)} <span style="font-size:13px">${pct(B.pnl_pct)}</span></div></div>
    <div><div class="l">Cash</div><div class="v num">${money(B.cash)} <span style="font-size:13px" class="muted">${has(B.cash_pct) ? Math.round(B.cash_pct) + '%' : ''}</span></div></div>
    <div><div class="l">Open</div><div class="v num">${B.positions.length}</div></div>`;

  const h = B.btc_hold || {};
  const rows = [{ name: 'Bolt', pct: B.pnl_pct }, { name: 'BTC held', pct: h.pnl_pct }];
  const scale = Math.max(1, ...rows.map(r => Math.abs(r.pct || 0)));
  $('race').innerHTML = rows.map(r => {
    const w = has(r.pct) ? Math.min(50, Math.abs(r.pct) / scale * 50) : 0;
    return `<div class="race"><div class="n">${esc(r.name)}</div>
      <div class="track"><div class="zero"></div>${has(r.pct) ? `<div class="bar ${r.pct >= 0 ? 'pos' : 'neg'}" style="width:${w}%"></div>` : ''}</div>
      <div class="v num ${cls(r.pct)}">${pct(r.pct)}</div></div>`;
  }).join('');
  $('since').textContent = B.started_utc ? 'since ' + when(B.started_utc) + (h.start_price ? ' · BTC then ' + price(h.start_price) : '') : '';
  $('curve').innerHTML = curve(B.curve);

  const bk = B.breakers, m = B.market;
  const dot = bk.halted || bk.dumping ? 'var(--down)' : m.stale ? 'var(--warn)' : 'var(--up)';
  $('status').innerHTML = `<span><span class="dot" style="background:${dot}"></span>${
      bk.halted ? 'Halted' : bk.dumping ? 'BTC dump switch on' : m.stale ? 'Prices stale' : 'Trading'}</span>
    <span>BTC <b class="num ${cls(bk.btc_change_24h)}">${pct(bk.btc_change_24h)}</b> 24h · switch at ${bk.dump_at}%</span>
    <span>Drawdown <b class="num ${cls(bk.from_reference_pct)}">${pct(bk.from_reference_pct, 1)}</b> from ${money(bk.reference)} · halt at ${bk.halt_at}%</span>
    <span>Prices ${clock(m.fetched_utc)} · every 10 min</span>
    <span>Next buy check ${clock(B.next_cycle_utc)}</span>`
    + (B.balances ? '<span class="up">✓ book balances</span>' : '<span class="err">⚠ the book does not balance</span>')
    + (bk.halted ? `<span class="err">no new buys until ${esc(B.rules.halt_hours)}h after ${when(bk.halted_since)}</span>` : '')
    + (B.last_error ? `<span class="err">⚠ last fetch failed ${when(B.last_error.utc)}: ${esc(B.last_error.error)}</span>` : '');

  $('wcount').textContent = B.coins.length;
  $('watch').innerHTML = B.coins.map(c => `<div class="w ${c.symbol === sel ? 'on' : ''}" data-s="${esc(c.symbol)}">
      <div class="row"><div class="sym"><span class="dotv" style="background:${c.held ? 'var(--gold2)' : c.out ? 'var(--dim)' : 'var(--c20)'}"></span>${esc(c.symbol)}</div>${badge(c)}</div>
      <div class="row" style="margin-top:6px"><div><div class="px num">${price(c.price)}</div>
        <div class="num ${cls(c.change_24h)}" style="font-size:12px">${pct(c.change_24h)} 24h</div></div>
        ${spark(c.spark.slice(-48))}</div>
      <div class="why">${c.held ? 'held · ' + pct(heldOf(c.symbol).pnl_pct, 1) + ' from entry' : esc(c.out || (c.points.join(' · ') || 'no rubric points'))}</div></div>`).join('')
    || '<div class="empty">No prices yet - the first tick fetches them.</div>';
  document.querySelectorAll('.w').forEach(el => el.onclick = () => { sel = el.dataset.s; render(); });

  const c = B.coins.find(x => x.symbol === sel);
  $('center').innerHTML = c ? center(c) : '<div class="box empty">No prices yet - Bolt fetches them every 10 minutes.</div>';
  side();
}

const heldOf = sym => B.positions.find(p => p.symbol === sym) || {};

function spark(v) {
  if (!v || v.length < 2) return '';
  const W = 110, H = 34, lo = Math.min(...v), hi = Math.max(...v), r = hi - lo || 1;
  const pts = v.map((c, i) => `${(i / (v.length - 1) * W).toFixed(1)},${(H - 3 - (c - lo) / r * (H - 6)).toFixed(1)}`).join(' ');
  const col = v[v.length - 1] >= v[0] ? 'var(--up)' : 'var(--down)';
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"/></svg>`;
}

// His account and BTC held, over time, from state/equity.jsonl via the board.
function curve(pts) {
  if (!pts || pts.length < 2) return '<div class="k" style="margin-top:6px">The account line starts after his second tick.</div>';
  const W = 1000, H = 90, L = 84, R = 6, T = 6, Bm = 16;
  const vals = pts.flatMap(p => [p.equity, p.btc_hold].filter(v => v));
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const x = i => L + (W - L - R) * i / (pts.length - 1), y = v => T + (hi - v) / span * (H - T - Bm);
  const line = (k, col) => `<polyline fill="none" stroke="${col}" stroke-width="1.8" points="${
    pts.map((p, i) => p[k] ? `${x(i).toFixed(1)},${y(p[k]).toFixed(1)}` : null).filter(Boolean).join(' ')}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:6px">
    <text x="${L - 6}" y="${y(hi) + 4}" fill="#596074" font-size="10" text-anchor="end">${money(hi)}</text>
    <text x="${L - 6}" y="${y(lo)}" fill="#596074" font-size="10" text-anchor="end">${money(lo)}</text>
    ${line('btc_hold', '#4cc9f0')}${line('equity', '#f7931a')}
    <text x="${W - R}" y="${H - 3}" fill="#596074" font-size="10" text-anchor="end"><tspan fill="#f7931a">━ Bolt</tspan>  <tspan fill="#4cc9f0">━ BTC held</tspan></text></svg>`;
}

function center(c) {
  const p = heldOf(c.symbol);
  const holding = c.held ? `<div class="box"><div class="k">His position</div>
    <div class="pos">
      <div class="stat"><div class="l">In at</div><div class="v num">${price(p.entry_price)}</div></div>
      <div class="stat"><div class="l">Now</div><div class="v num ${cls(p.pnl_pct)}">${pct(p.pnl_pct)}</div></div>
      <div class="stat"><div class="l">Worth</div><div class="v num">${money(p.value)}</div></div>
      <div class="stat"><div class="l">P&amp;L</div><div class="v num ${cls(p.pnl)}">${money(p.pnl)}</div></div>
      <div class="stat"><div class="l">Stop</div><div class="v num">${price(p.stop_price)}</div><div class="l">${p.breakeven ? 'breakeven' : '-' + B.rules.stop_loss_pct + '%'}</div></div>
      <div class="stat"><div class="l">Target</div><div class="v num">${price(p.take_profit_price)}</div><div class="l">+${B.rules.take_profit_pct}%</div></div>
      <div class="stat"><div class="l">Best</div><div class="v num">${pct(p.high_water_pct, 1)}</div><div class="l">breakeven at +${B.rules.breakeven_at_pct}%</div></div>
      <div class="stat"><div class="l">Held</div><div class="v num">${has(p.held_hours) ? p.held_hours.toFixed(1) + 'h' : '—'}</div><div class="l">dead money at ${B.rules.dead_money_hours}h</div></div>
    </div></div>` : '';
  return `
  <div class="box"><div class="tick">
    <div><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="s">${esc(c.symbol)}</span>${badge(c)}
      <span class="k">${esc(c.name || '')}</span></div>
      <div class="muted" style="margin-top:6px">${c.held ? 'Held now - never bought twice' : c.out ? 'Cannot be bought: ' + esc(c.out) : 'Bought only at ' + B.rules.min_score + '/10 or better, on a buy check'}</div></div>
    <div><div class="p num">${price(c.price)}</div>
      <div class="num ${cls(c.change_24h)}" style="text-align:right;font-size:15px">${pct(c.change_24h)} 24h</div>
      <div class="num" style="text-align:right;color:var(--dim);font-size:12px">1h ${pct(c.change_1h)} · 7d ${pct(c.change_7d)}</div></div>
  </div></div>
  ${holding}
  <div class="box"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div class="k">7 days · hourly</div>
      <div class="k"><span style="color:var(--c20)">━ 20h avg ${price(c.ma_20h)}</span> &nbsp; <span style="color:var(--c50)">━ 50h avg ${price(c.ma_50h)}</span></div></div>
    ${chart(c)}</div>
  <div class="gauges">
    <div class="box g"><div class="k">Score</div><div class="scorebig num" style="color:${c.score >= B.rules.min_score ? 'var(--up)' : 'var(--ink)'}">${c.score}<span style="font-size:15px" class="muted">/10</span></div>
      <div class="k" style="font-size:9.5px">buys at ${B.rules.min_score}+</div></div>
    <div class="box g"><div class="k">vs 20h avg</div><div class="big num ${cls(c.vs_ma20_pct)}">${pct(c.vs_ma20_pct)}</div></div>
    <div class="box g"><div class="k">vs 50h avg</div><div class="big num ${cls(c.vs_ma50_pct)}">${pct(c.vs_ma50_pct)}</div></div>
    <div class="box g"><div class="k">Size</div><div class="big num">${big(c.market_cap)}</div>
      <div class="k" style="font-size:9.5px">${big(c.volume_24h)} traded 24h</div></div>
  </div>
  <div class="box"><div class="k" style="color:var(--gold2);margin-bottom:6px">The rubric</div>
    ${(c.rubric || []).map(r => `<div class="rub ${r.ok ? 'ok' : 'no'}"><span class="pt">+${r.pts}</span><span>${esc(r.rule)}</span><span>${r.ok ? '✓' : '·'}</span></div>`).join('')}
    ${c.out ? `<div class="rub no"><span class="pt">✕</span><span>${esc(c.out)}</span><span></span></div>` : ''}</div>`;
}

function chart(c) {
  const v = c.spark || [];
  if (v.length < 2) return '<div class="empty">The chart appears after the next tick.</div>';
  const W = 820, H = 260, L = 64, R = 8, T = 10, Bm = 22;
  const all = v.concat((c.ma20_line || []).filter(has), (c.ma50_line || []).filter(has));
  const p = heldOf(c.symbol);
  if (c.held) all.push(p.entry_price, p.stop_price);
  const lo = Math.min(...all), hi = Math.max(...all), span = hi - lo || 1;
  const x = i => L + (W - L - R) * i / (v.length - 1), y = val => T + (hi - val) / span * (H - T - Bm);
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const val = lo + span * k / 4, yy = y(val);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,.06)"/>
      <text x="${L - 6}" y="${yy + 3}" fill="#596074" font-size="10" text-anchor="end">${price(val)}</text>`;
  }
  for (let d = 1; d <= 6; d++) {
    const i = v.length - 1 - d * 24;
    if (i <= 0) break;
    g += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - Bm}" stroke="rgba(255,255,255,.04)"/>
      <text x="${x(i)}" y="${H - 6}" fill="#596074" font-size="10" text-anchor="middle">-${d}d</text>`;
  }
  const line = (vals, col, w) => {
    const pts = (vals || []).map((val, i) => has(val) ? `${x(i).toFixed(1)},${y(val).toFixed(1)}` : null).filter(Boolean);
    return pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="${w}"/>` : '';
  };
  const level = (val, col, label) => `<line x1="${L}" x2="${W - R}" y1="${y(val)}" y2="${y(val)}" stroke="${col}" stroke-dasharray="5 4"/>
    <text x="${W - R - 4}" y="${y(val) - 4}" fill="${col}" font-size="10" text-anchor="end">${label} ${price(val)}</text>`;
  g += line(c.ma50_line, '#a78bfa', 1.4) + line(c.ma20_line, '#4cc9f0', 1.4)
     + line(v, v[v.length - 1] >= v[0] ? '#2fd39b' : '#f0646f', 2);
  if (c.held) g += level(p.entry_price, '#ffb04a', 'in') + level(p.stop_price, '#f0646f', 'stop');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:6px">${g}</svg>`;
}

/* ---------------- the right-hand panel ---------------- */

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  side();
});

async function reportList() {
  try { return (await (await fetch('/api/reports/bolt', { cache: 'no-store' })).json()).reports || []; }
  catch { return []; }
}

async function showReport(name) {
  shownReport = name;
  const host = $('side');
  if (!name) { host.innerHTML = '<div class="empty">No report yet - the first buy check writes one.</div>'; return; }
  try {
    const j = await (await fetch('/api/reports/bolt/' + encodeURIComponent(name), { cache: 'no-store' })).json();
    if (tab === 'report' || tab === 'history') host.innerHTML = mdToHtml(j.markdown || '');
  } catch (e) { host.innerHTML = `<div class="err">Could not read ${esc(name)}</div>`; }
}

async function side() {
  const host = $('side');
  if (tab === 'report') {
    const list = await reportList();
    return showReport(list[0] ? list[0].name : null);
  }
  if (tab === 'history') {
    const list = await reportList();
    host.innerHTML = list.length ? '<div class="hist">' + list.map(r =>
      `<button data-f="${esc(r.name)}">${esc(r.name.replace('.md', ''))}</button>`).join('') + '</div>'
      : '<div class="empty">No reports yet.</div>';
    host.querySelectorAll('[data-f]').forEach(b => b.onclick = () => showReport(b.dataset.f));
    return;
  }
  if (tab === 'trades') {
    const s = B.closed;
    host.innerHTML = `<div class="stats">
        <div class="stat"><div class="l">Closed</div><div class="v num">${s.n}</div></div>
        <div class="stat"><div class="l">Won</div><div class="v num">${s.wins} <span class="muted" style="font-size:12px">${has(s.win_rate) ? Math.round(s.win_rate) + '%' : ''}</span></div></div>
        <div class="stat"><div class="l">Realized</div><div class="v num ${cls(s.realized)}">${money(s.realized)}</div></div>
        <div class="stat"><div class="l">Fees paid</div><div class="v num">${money(s.fees)}</div></div></div>
      <div class="sect">Every trade, newest first</div>
      ${B.trades.length ? `<div class="tw"><table class="tbl"><tr><th>When</th><th></th><th>Coin</th><th>Price</th><th>$</th><th>P&amp;L</th></tr>${
        B.trades.map(t => `<tr title="${esc(t.reason)}"><td>${when(t.utc)}</td>
          <td class="${t.side === 'buy' ? 'up' : 'down'}">${t.side === 'buy' ? 'BUY' : 'SELL'}</td><td>${esc(t.symbol)}</td>
          <td class="num">${price(t.price)}</td><td class="num">${money(t.notional)}</td>
          <td class="num ${cls(t.pnl)}">${t.side === 'sell' ? pct(t.pnl_pct, 1) : ''}</td></tr>
          <tr><td colspan="6" class="muted" style="font-size:11px;padding-top:0">${esc(t.reason)}</td></tr>`).join('')}</table></div>`
        : '<div class="empty">No trades yet. He buys only what scores 7 or more, at most one coin every 4 hours.</div>'}`;
    return;
  }
  const r = B.rules;
  host.innerHTML = `<div class="sect" style="margin-top:0">How Bolt trades</div>
    <div class="muted">All of it is code (scripts/bolt.py). No AI is woken, so nothing here costs anything and no number is made up.</div>
    <div class="sect">Every 10 minutes</div><ul class="rules">
      <li>One price check for all ten coins (CoinGecko).</li>
      <li>Take profit at <b>+${r.take_profit_pct}%</b> - the whole position.</li>
      <li>Stop loss at <b>-${r.stop_loss_pct}%</b>, raised to the price paid once he has been <b>+${r.breakeven_at_pct}%</b> up.</li>
      <li>Dead money: open <b>${r.dead_money_hours}h</b> and still within <b>${r.dead_money_band_pct}%</b> either way - sold.</li>
      <li>BTC down more than <b>${Math.abs(r.btc_dump_pct)}%</b> on the day: every coin but BTC is sold, and nothing new is bought.</li>
      <li>Sales fill at that tick's price, not the stop's, less a <b>${r.fee_pct}%</b> fee.</li></ul>
    <div class="sect">Every ${r.cycle_hours} hours</div><ul class="rules">
      <li>At most one new coin, the best scoring <b>${r.min_score}/10</b> or more.</li>
      <li>Never: one already held, one up <b>${r.chase_pct}%+</b> on the day, one at or under its 50h average, or one under ${big(r.min_market_cap)} in size or ${big(r.min_volume_24h)} traded a day.</li>
      <li>As many coins as he likes, one of each, every new one about <b>${r.target_pct}%</b> of the account - but <b>${r.cash_floor_pct}%</b> always stays in cash, so the last one may be smaller.</li></ul>
    <div class="sect">The score</div><ul class="rules">
      <li>+4 uptrend: price above its 20h average, the 20h above the 50h</li>
      <li>+2 within 2% of the 20h average and rising this hour</li>
      <li>+2 up 1% to 15% on the day</li><li>+1 up on the week</li><li>+1 BTC up on the day</li></ul>
    <div class="sect">If it goes wrong</div><ul class="rules">
      <li>Down <b>${r.max_drawdown_pct}%</b>: no new buys for <b>${r.halt_hours}h</b>, then he starts again on his own and counts from there.</li></ul>`;
}

load();
setInterval(load, 60000);
</script>
