<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Stan</title>
<!-- Stan, the opportunity hunter (owner, 2026-10-14): software pains people
     wrote on Hacker News, judged once a day, for the owner to approve into
     the Agent Room or reject with a reason. Everything comes from
     scripts/stan.py through /api/stan; nothing is worked out on this page.
     Opened from Stan's house in the village (?embed=1). -->
<style>
  :root{
    --bg:#0b1020; --panel:#10172a; --card:#131b31; --line:rgba(148,163,184,.16);
    --ink:#e6e9f2; --mute:#94a0b8; --dim:#5f6b85;
    --green:#22c55e; --green2:#4ade80; --amber:#f59e0b; --red:#f43f5e; --blue:#38bdf8; --violet:#a78bfa; --orange:#fb923c;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding:16px}
  body.embed{padding:10px;background:rgba(5,8,16,.94)}
  a{color:var(--blue)}
  .frame{max-width:1100px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 20px 70px rgba(0,0,0,.5);overflow:hidden}
  .head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;padding:20px 22px 14px}
  .head h1{margin:0;font-size:26px}
  .head .sub{color:var(--mute);margin-top:2px}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .pill{font-size:12.5px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
  .pill.g{color:var(--green2);border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.08)}
  .pill.a{color:#fbbf24;border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.08)}
  .pill.r{color:#fb7185;border-color:rgba(244,63,94,.45);background:rgba(244,63,94,.08)}
  .sp{flex:1}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font:600 13px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line);
    border-radius:8px;padding:9px 14px;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-block}
  .btn:hover{border-color:var(--mute)}
  .btn.go{color:var(--green2);border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.08)}
  .btn.warn{color:#fb7185;border-color:rgba(244,63,94,.5)}
  .btn.look{color:#fff;border-color:rgba(251,146,60,.6);background:rgba(251,146,60,.16)}
  .btn:disabled{opacity:.5;cursor:default}
  .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
  .muted{color:var(--mute);font-size:13px}
  .err{color:#fb7185}
  .status{margin:0 22px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px}
  .tabs{display:flex;gap:6px;padding:0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{font:600 14px var(--sans);color:var(--mute);background:none;border:0;border-bottom:2px solid transparent;padding:12px 10px;cursor:pointer;white-space:nowrap}
  .tab.on{color:var(--ink);border-bottom-color:var(--orange)}
  .tab .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;font-size:11.5px;background:rgba(148,163,184,.18);color:var(--ink);text-align:center}
  .body{padding:16px 22px 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .ctop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .cname{font-weight:700;font-size:16px;overflow-wrap:anywhere}
  .score{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
  .bar .l{font-size:11.5px;color:var(--mute)}
  .bar .t{height:6px;border-radius:3px;background:rgba(148,163,184,.15);overflow:hidden;margin-top:3px}
  .bar .t i{display:block;height:100%;background:var(--orange)}
  .quote{border-left:3px solid var(--orange);padding:4px 0 4px 10px;margin:6px 0;color:#dfe5f1;overflow-wrap:anywhere}
  .quote .src{font-size:12px;color:var(--mute)}
  .tag{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid;display:inline-block}
  .t-green{color:var(--green2);border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.1)}
  .t-red{color:#fb7185;border-color:rgba(244,63,94,.5);background:rgba(244,63,94,.1)}
  .empty{color:var(--mute);padding:30px 6px;text-align:center}
  textarea{width:100%;font:14px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px;min-height:64px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mute);font-weight:600}
  pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0 0}
  @media (max-width:700px){
    body{padding:0} .frame{border-radius:0;border:0}
    .head,.body{padding-left:16px;padding-right:16px} .status{margin:0 16px 12px} .tabs{padding:0 12px}
    .bars{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>
<script src="/shared/busy.js"></script>
</head>
<body>
<div class="frame">
  <div class="head">
    <div>
      <h1>Stan</h1>
      <div class="sub">Software pains people wrote on Hacker News and Reddit, judged once a day. Approve one and it goes to the Agent Room.</div>
      <div class="pills" id="pills"></div>
    </div>
    <div class="sp"></div>
    <div class="acts">
      <button class="btn look" id="look">Look now</button>
      <a class="btn" id="back" href="/dashboard">← Deck</a>
      <button class="btn" id="close" style="display:none">✕ Close</button>
    </div>
  </div>
  <div class="status" id="status">Loading…</div>
  <div class="tabs" id="tabs"></div>
  <div class="body" id="body"></div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Links are built by stan.py from a post's number - news.ycombinator.com only.
const hn = u => /^https:\/\/news\.ycombinator\.com\/item\?id=\d+$/.test(u || '') ? u : null;
// Reddit posts come through web search (reddit_search.py) as a post's own link, rebuilt by code.
const rd = u => /^https:\/\/www\.reddit\.com\/r\/[A-Za-z0-9_]{2,21}\/comments\/[a-z0-9]{4,10}\/$/.test(u || '') ? u : null;
const when = u => { const d = new Date(u); return isNaN(d) ? '' : d.toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); };

if (new URLSearchParams(location.search).get('embed') === '1') {
  document.body.classList.add('embed');
  $('back').style.display = 'none';
  $('close').style.display = '';
  const close = () => parent.postMessage({ type: 'stan-close' }, '*');
  $('close').onclick = close;
  addEventListener('keydown', e => { if (e.key === 'Escape' && document.activeElement.tagName !== 'TEXTAREA') close(); });
}

let D = null, tab = 'pending', busy = false, sig = '';

// "Load failed" is all Safari says when the Deck cannot be reached at all -
// usually because it is restarting. Said in words instead, with what to do.
const UNREACHABLE = 'Could not reach the Deck - it may be restarting. Wait a few seconds and try again; nothing was lost.';
async function api(url, opts) {
  let r;
  try { r = await fetch(url, Object.assign({ headers: { 'Content-Type': 'application/json' }, cache: 'no-store' }, opts || {})); }
  catch (e) { throw new Error(UNREACHABLE); }
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok || j.ok === false) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

function quoteHtml(e, label) {
  const link = hn(e.link) || rd(e.link), site = rd(e.link) ? 'on Reddit (found by web search)' : 'on Hacker News';
  return `<div class="quote">“${esc(e.quote)}”
    <div class="src">${label ? esc(label) + ' · ' : ''}${e.author ? esc(e.author) + ' · ' : ''}${link ? `<a href="${link}" target="_blank" rel="noopener noreferrer">${site}</a>` : ''}${e.thread ? ' · in “' + esc(e.thread) + '”' : ''}</div></div>`;
}

function bars(s) {
  return `<div class="bars">${[['Frequency 30%', s.frequency], ['Pay signal 30%', s.pay], ['Buildable 25%', s.buildability], ['Gap 15%', s.gap]]
    .map(([l, v]) => `<div class="bar"><div class="l">${l} · ${v}</div><div class="t"><i style="width:${v * 10}%"></i></div></div>`).join('')}</div>`;
}

function card(p, decided) {
  const tag = p.status === 'approved' ? `<span class="tag t-green">approved${p.agentroom_practice ? ' · practice run' : ''}</span>`
    : p.status === 'rejected' ? '<span class="tag t-red">rejected</span>' : '';
  return `<div class="card">
    <div class="ctop"><div style="min-width:0;flex:1"><div class="cname">${esc(p.title)} ${tag}</div>
      <div class="muted">${esc(p.id)} · for ${esc(p.target_user)} · surfaced ${esc(when(p.surfaced_utc))}</div></div>
      <div class="score">${esc(p.score)}<span class="muted">/10</span></div></div>
    <div style="margin-top:8px">${esc(p.problem)}</div>
    ${bars(p.scores)}
    <div class="muted">Said by ${p.people} ${p.people === 1 ? 'person' : 'different people'}. Existing solutions: ${esc(p.existing_solutions)}</div>
    ${p.evidence.map(e => quoteHtml(e)).join('')}
    ${p.pay_quote ? quoteHtml(p.pay_quote, 'would pay') : ''}
    ${decided ? (p.reason ? `<div class="muted" style="margin-top:6px">Why not: ${esc(p.reason)}</div>` : '')
      + (p.agentroom_run ? `<div class="muted" style="margin-top:6px">Agent Room run ${esc(p.agentroom_run)} - <a href="/agentroom">open the Agent Room</a></div>` : '') : `
    <div class="acts" style="margin-top:10px">
      <button class="btn go" data-act="approve" data-id="${esc(p.id)}">Approve → Agent Room</button>
      <button class="btn warn" data-act="rejectopen" data-id="${esc(p.id)}">Reject…</button>
    </div>
    <div id="rj-${esc(p.id)}" style="display:none">
      <textarea id="rt-${esc(p.id)}" maxlength="300" placeholder="Why not? (Stan learns your taste from this)"></textarea>
      <div class="acts" style="margin-top:6px"><button class="btn warn" data-act="reject" data-id="${esc(p.id)}">Reject it</button></div>
    </div>`}
  </div>`;
}

function render() {
  const d = D;
  const pills = [];
  const f = d.fetch;
  pills.push(f && f.ok ? `<span class="pill g">● Hacker News · ${f.new} new on ${esc(when(f.utc))}</span>`
    : f ? '<span class="pill r">○ Last fetch failed</span>' : '<span class="pill a">○ Not fetched yet</span>');
  const r = f && f.reddit && typeof f.reddit === 'object' ? f.reddit : null;
  pills.push(r ? (r.ok ? `<span class="pill g">● Reddit · ${r.new} new (web search)</span>`
                       : `<span class="pill a" title="${esc(r.note || '')}">○ Reddit not read today</span>`)
               : '<span class="pill">Reddit: not fetched yet</span>');
  pills.push(`<span class="pill">${esc(d.model)}</span>`);
  pills.push(`<span class="pill">Today $${Number(d.spent_today).toFixed(4)} of $${Number(d.limits.stan_daily_ai).toFixed(2)}</span>`);
  $('pills').innerHTML = pills.join('');

  const c = d.last_cycle, j = d.job;
  $('status').innerHTML = (j && j.state === 'running') ? '<b>Stan is looking</b> - fetching Hacker News and Reddit, then one AI read. A minute or two.'
    : `${c ? `<b>Last look ${esc(when(c.utc))}:</b> ${esc(c.line)}${c.error ? `<div class="err">${esc(c.error)}</div>` : ''}` : '<b>Stan has not looked yet.</b> Press Look now, or wait for 6:22am.'}
       <div class="muted" style="margin-top:4px">${d.unread} post(s) waiting to be read · ${d.backlog} in the backlog · ${d.ledger} problem(s) ever surfaced (never shown twice) · keeps ${esc(d.min_score)}+ and at most ${esc(d.max_surfaced)} a day</div>
       ${j && j.state === 'failed' ? `<pre>${esc(j.log)}</pre>` : ''}`;
  $('look').disabled = !!(j && j.state === 'running');

  const tabs = [['pending', 'For you', d.pending.length], ['decided', 'Decided', d.decided.length], ['watch', 'What he watches', d.watchlist.length]];
  $('tabs').innerHTML = tabs.map(([k, n, c]) => `<button class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${n}<span class="n">${c}</span></button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; sig = ''; render(); });

  let html;
  if (tab === 'pending') html = d.pending.length ? d.pending.map(p => card(p, false)).join('')
    : '<div class="empty">Nothing waiting for you. Stan keeps only problems that score 6.0 or more, so a quiet day is normal.</div>';
  else if (tab === 'decided') html = d.decided.length ? d.decided.map(p => card(p, true)).join('') : '<div class="empty">No decisions yet.</div>';
  else html = `<p class="muted">Each phrase is searched on Hacker News as an exact phrase. The weight is how often a match is a real software pain - a starting guess, in <code>agents/stan/watchlist.json</code>.</p>
    <table><thead><tr><th>Phrase</th><th>Weight</th><th>Last fetch</th></tr></thead><tbody>
    ${d.watchlist.map(w => { const r = (f && f.phrases || []).find(x => x.phrase === w.phrase);
      return `<tr><td>“${esc(w.phrase)}”</td><td>${esc(w.weight)}</td><td>${r ? (r.error ? `<span class="err">${esc(r.error)}</span>` : `${r.found} found, ${r.new} new`) : '-'}</td></tr>`; }).join('')}
    </tbody></table>`;
  $('body').innerHTML = html;
  $('body').querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act, b.dataset.id, b));
}

async function act(what, id, btn) {
  if (what === 'rejectopen') { const el = $('rj-' + id); el.style.display = el.style.display === 'none' ? 'block' : 'none'; return; }
  const body = {};
  if (what === 'reject') {
    body.reason = ($('rt-' + id).value || '').trim();
    if (body.reason.length < 3) { alert('Say why in a few words - Stan learns your taste from it.'); return; }
  }
  btn.disabled = true;
  try {
    const r = await api(`/api/stan/problems/${id}/${what}`, { method: 'POST', body: JSON.stringify(body) });
    if (what === 'approve') alert(r.practice
      ? 'Sent to the Agent Room as a PRACTICE run - it has no key of its own yet.'
      : 'Sent to the Agent Room - the planner is on it.');
  } catch (e) { alert(e.message); }
  sig = ''; await refresh();
}

$('look').onclick = async () => {
  if (!confirm('Fetch Hacker News now and let Stan read the new posts? The read is one cheap AI call on the shared key (about a fifth of a cent).')) return;
  try { await api('/api/stan/run', { method: 'POST', body: '{}' }); } catch (e) { alert(e.message); }
  sig = ''; refresh();
};

async function refresh() {
  if (busy) return;
  busy = true;
  try {
    D = await api('/api/stan');
    // Redraw only on a change, so a half-typed reason is never wiped.
    const s = JSON.stringify([D.pending.map(p => p.id), D.decided.map(p => p.id + p.status), D.job && D.job.state, D.last_cycle && D.last_cycle.utc, D.fetch && D.fetch.utc]);
    if (s !== sig) { sig = s; render(); }
  } catch (e) { $('status').innerHTML = `<span class="err">${esc(e.message)}</span>`; sig = ''; }
  finally { busy = false; }
}
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
</script>
</body>
</html>
